<style>
  :root{--ink:#2f2566;--muted:#6f6a8c;--acc:#7461c8;--acc2:#5b4aa8;--line:#e2dcf4;--err:#c04a42}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;
    background:radial-gradient(900px 600px at 15% 10%,#ece6ff 0,transparent 60%),radial-gradient(800px 600px at 90% 95%,#e3d9ff 0,transparent 60%),linear-gradient(160deg,#f7f4ff,#ede7fb)}
  .bg i{position:fixed;border-radius:50%;filter:blur(2px);opacity:.55;animation:fl 9s ease-in-out infinite}
  .bg i:nth-child(1){width:220px;height:220px;left:-60px;top:12%;background:radial-gradient(circle at 30% 30%,#d9ccff,#b9a6f5);animation-delay:0s}
  .bg i:nth-child(2){width:140px;height:140px;right:8%;top:8%;background:radial-gradient(circle at 30% 30%,#e6dcff,#c8b8fa);animation-delay:-3s}
  .bg i:nth-child(3){width:300px;height:300px;right:-90px;bottom:-60px;background:radial-gradient(circle at 30% 30%,#cdbdfb,#a692ee);animation-delay:-5s}
  .bg i:nth-child(4){width:90px;height:90px;left:12%;bottom:12%;background:radial-gradient(circle at 30% 30%,#efe8ff,#d3c5fb);animation-delay:-7s}
  @keyframes fl{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.06)}}
  .card{position:relative;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid #e6e0f7;border-radius:28px;box-shadow:0 24px 70px rgba(91,74,168,.22);padding:34px 30px 30px;width:100%;max-width:420px;text-align:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}

  .av{position:relative;width:190px;height:190px;margin:-112px auto 12px;border-radius:50%;animation:fl2 4.8s ease-in-out infinite}
  .av .ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#5b2bd6,#a77bff,#f6d28b,#d9a441,#7b3fe4,#3b1c9c,#5b2bd6);animation:spin 7s linear infinite,pulse 3.2s ease-in-out infinite;box-shadow:0 0 22px 5px rgba(140,90,255,.55),0 0 44px 12px rgba(140,90,255,.28)}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
  .av .disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 10px 26px rgba(60,20,120,.3)}
  .av .disc img,.av .lyr{position:absolute;inset:0;width:100%;height:100%;display:block}
  .av .fig{position:absolute;inset:0;transform-origin:62% 74%;animation:bob 4.8s ease-in-out infinite}
  .av .hair{transform-origin:62% 48%;animation:sway 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.6%) rotate(.9deg)}}
  @keyframes sway{0%,100%{transform:rotate(0) skewX(0)}30%{transform:rotate(-2.6deg) skewX(1.4deg)}70%{transform:rotate(1.4deg) skewX(-.8deg)}}
  .av .blink{position:absolute;left:63.4%;top:57.9%;width:3.8%;height:3.1%;background:#f7f5f9;border-radius:50%;opacity:0;animation:blk 5.2s infinite}
  .av .blink:after{content:"";position:absolute;left:-6%;right:-6%;bottom:22%;height:2px;border-bottom:2px solid #3b2a6e;border-radius:0 0 60% 60%}
  @keyframes blk{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
  .av .st{position:absolute;width:10px;height:10px;pointer-events:none;opacity:0;animation:tw 3.2s ease-in-out infinite}
  .av .st:before,.av .st:after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;box-shadow:0 0 8px 2px #fff,0 0 14px 4px rgba(254,228,64,.75);transform:translate(-50%,-50%)}
  .av .st:before{width:2px;height:100%}.av .st:after{width:100%;height:2px}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
  .av .sh{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
  .av .sh:after{content:"";position:absolute;top:-30%;bottom:-30%;width:32%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);animation:shine 4.2s ease-in-out infinite}
  .av .glow{position:absolute;left:14%;right:14%;bottom:-20px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(116,97,200,.55),transparent 70%);animation:shd 4.8s ease-in-out infinite}

  @keyframes fl2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes shd{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.78);opacity:.45}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
  .hi{margin:16px 0 2px;font-size:15px;font-weight:700;color:var(--acc);letter-spacing:.3px}
  h1{margin:0 0 6px;font-size:34px;line-height:1.1;font-weight:800;background:linear-gradient(90deg,#4b3d8f,#7b5fe0,#4b3d8f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tx 4s linear infinite}
  @keyframes tx{to{background-position:-200% 0}}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  label{display:block;text-align:right;font-size:14px;margin:0 0 6px;font-weight:700;color:var(--ink)}
  input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;font-size:16px;background:#fff;color:var(--ink);direction:ltr;text-align:left;transition:border-color .2s,box-shadow .2s}
  input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px rgba(116,97,200,.18)}
  button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#7660d4,#5f4bb8);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(106,85,196,.35);transition:transform .15s,box-shadow .15s}
  button:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(106,85,196,.42)} button:disabled{opacity:.6;cursor:default}
  .link{background:none;color:var(--acc2);font-size:13px;margin-top:10px;padding:4px;width:auto;text-decoration:underline;box-shadow:none}
  .link:hover{background:none;box-shadow:none;transform:none}
  .msg{margin-top:14px;font-size:14px;min-height:20px;line-height:1.5;color:var(--acc2)}
  .msg.err{color:var(--err)}
  .hid{display:none}
  .bar{height:7px;border-radius:99px;background:#ebe6fa;overflow:hidden;margin:16px 10px 12px}
  .bar b{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#a48df0,#6a55c4,#a48df0);background-size:200% 100%;animation:bar 1.6s ease-in-out infinite,sh 1.2s linear infinite}
  @keyframes bar{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
  @keyframes sh{to{background-position:-200% 0}}
  #loadTxt{font-weight:700;color:var(--acc2);font-size:15px}
  .dots span{display:inline-block;animation:dt 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes dt{0%,80%,100%{opacity:.2}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .char{position:relative;width:270px;height:280px;margin:-170px auto 6px}
  .char .halo{position:absolute;left:4%;right:4%;top:8%;bottom:6%;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0,rgba(255,255,255,.85) 45%,rgba(190,170,250,.35) 72%,transparent 74%);box-shadow:0 0 40px 10px rgba(140,100,255,.35);animation:pulseh 3.6s ease-in-out infinite}
  @keyframes pulseh{0%,100%{box-shadow:0 0 34px 8px rgba(140,100,255,.30)}50%{box-shadow:0 0 56px 16px rgba(140,100,255,.5)}}
  .char .csv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(70,40,140,.25))}
  .char .fg{transform-box:fill-box;transform-origin:70% 90%;animation:bob 4.6s ease-in-out infinite}
  .char .hairG{transform-box:view-box;transform-origin:72% 22%;animation:sway 3.2s ease-in-out infinite}
  .char .blk{opacity:0;animation:blk 5s infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.8deg)}}
  @keyframes sway{0%,100%{transform:rotate(0) skewX(0)}30%{transform:rotate(-2.8deg) skewX(1.6deg)}70%{transform:rotate(1.6deg) skewX(-1deg)}}
  @keyframes blk{0%,91%,100%{opacity:0}93%,97%{opacity:1}}
  .char .st{position:absolute;width:11px;height:11px;opacity:0;animation:tw 3s ease-in-out infinite}
  .char .st:before,.char .st:after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;box-shadow:0 0 8px 2px #fff,0 0 16px 5px rgba(160,120,255,.8);transform:translate(-50%,-50%)}
  .char .st:before{width:2px;height:100%}.char .st:after{width:100%;height:2px}
  .char .st.gl:before,.char .st.gl:after{box-shadow:0 0 8px 2px #fff,0 0 14px 4px rgba(254,228,64,.8)}
  .bub{position:absolute;right:-46px;top:-20px;background:#fff;border:1.5px solid #d8cdf5;color:#4b3d8f;font-weight:800;font-size:13px;padding:7px 12px;border-radius:16px 16px 16px 4px;box-shadow:0 8px 20px rgba(91,74,168,.22);white-space:nowrap;opacity:0;transform:scale(.6) translateY(8px);transform-origin:bottom left;animation:bub .6s .9s cubic-bezier(.2,1.4,.4,1) forwards,bubf 4s 1.6s ease-in-out infinite}
  @keyframes bub{to{opacity:1;transform:none}}
  @keyframes bubf{50%{transform:translateY(-4px)}}
  .hi{display:none}

  .char .rg{position:absolute;left:2%;right:2%;top:6%;bottom:4%;border-radius:50%;z-index:0;background:conic-gradient(from 0deg,#5b2bd6,#a77bff,#f6d28b,#d9a441,#7b3fe4,#3b1c9c,#5b2bd6);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(closest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));animation:spin 7s linear infinite;filter:drop-shadow(0 0 8px rgba(160,110,255,.9))}
  .char .halo{z-index:0}.char .csv{z-index:1}
  .char .sw{position:absolute;left:4%;right:4%;top:8%;bottom:6%;border-radius:50%;overflow:hidden;z-index:2;pointer-events:none}
  .char .sw:after{content:"";position:absolute;top:-30%;bottom:-30%;width:30%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:shine 3.8s ease-in-out infinite}
  .char .st{z-index:3}
  .char .st.sm:before,.char .st.sm:after{box-shadow:0 0 6px 2px #fff,0 0 12px 4px rgba(190,150,255,.9)}
  .char .st.sm{width:9px;height:9px}
  .char .st.gl:before,.char .st.gl:after{background:#fff6c8;box-shadow:0 0 8px 3px #fff,0 0 18px 6px rgba(255,210,70,.85)}
  .char .dt{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.95),0 0 10px 3px rgba(170,130,255,.7);opacity:0;animation:tw 2.4s ease-in-out infinite;z-index:3}

  body{flex-direction:column}
  .stage{display:flex;align-items:center;justify-content:center;gap:34px;width:100%;max-width:880px}
  .card{margin:0 !important;flex:0 1 420px}
  .card .av,.card .hi{display:none}
  .char2{position:relative;width:300px;height:540px;flex:0 0 300px}
  .char2 .halo2{position:absolute;left:0;right:0;top:calc(50% - 150px);height:300px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0,rgba(255,255,255,.8) 50%,rgba(190,170,250,.35) 74%,transparent 76%);box-shadow:0 0 50px 12px rgba(140,100,255,.35);animation:pulseh 3.6s ease-in-out infinite}
  .char2 .rg2{position:absolute;left:-8px;right:-8px;top:calc(50% - 158px);height:316px;border-radius:50%;background:conic-gradient(from 0deg,#5b2bd6,#a77bff,#f6d28b,#d9a441,#7b3fe4,#3b1c9c,#5b2bd6);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(closest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));animation:spin 8s linear infinite;filter:drop-shadow(0 0 9px rgba(160,110,255,.9))}
  .char2 .fb{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 12px rgba(70,40,140,.28));z-index:1}
  .char2 .body{transform-box:view-box;transform-origin:200px 700px;animation:bob2 4.6s ease-in-out infinite}
  @keyframes bob2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(.5deg)}}
  .char2 .hairB,.char2 .hairF{transform-box:view-box;transform-origin:200px 90px;animation:sway2 3.4s ease-in-out infinite}
  .char2 .hairF{animation-delay:-.4s}
  @keyframes sway2{0%,100%{transform:rotate(0)}35%{transform:rotate(-1.8deg)}70%{transform:rotate(1.2deg)}}
  .char2 .head{transform-box:view-box;transform-origin:200px 200px;animation:nod 5s ease-in-out infinite}
  @keyframes nod{0%,100%{transform:rotate(0)}40%{transform:rotate(2deg)}75%{transform:rotate(-1.5deg)}}
  .char2 .wave{transform-box:view-box;transform-origin:248px 254px;animation:w1 2.6s ease-in-out infinite}
  .char2 .fore{transform-box:view-box;transform-origin:282px 306px;animation:w2 .9s ease-in-out infinite alternate}
  @keyframes w1{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
  @keyframes w2{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  .char2 .lid{opacity:0;animation:blk 4.6s infinite}
  .char2 .sw2{position:absolute;left:0;right:0;top:calc(50% - 150px);height:300px;border-radius:50%;overflow:hidden;z-index:2;pointer-events:none}

  function jres(o,st){ return new Response(JSON.stringify(o),{status:st||200,headers:{'Content-Type':'application/json'}}); }
  function installShim(){
    var _f=window.fetch.bind(window);
    window.fetch=function(input, init){
      var url=(typeof input==='string')?input:(input&&input.url); init=init||{};
      var r=route(url,(init.method||'GET').toUpperCase());
      if(!r) return _f(input,init);
      if(r.none) return Promise.resolve(jres({ok:false,msg:'לא זמין בגרסת הענן'},404));
      if(r.portal){ var pr=null; try{ pr=window.__cloudPortal?window.__cloudPortal(r.portal,init):null; }catch(e){ pr=null; } return pr||Promise.resolve(jres({ok:false,reason:'לא זמין בגרסת הענן'},404)); }
      if(r.inbox){ var fl=null; try{ fl=init.body&&init.body.get?init.body.get('file'):null; }catch(_){}
        if(!fl) return Promise.resolve(jres({ok:false,reason:'אין קובץ'}));
        return new Promise(function(ok,no){ var fr=new FileReader(); fr.onload=function(){ ok(String(fr.result).split(',')[1]||''); }; fr.onerror=no; fr.readAsDataURL(fl); })
          .then(function(b64){ return fresh().then(function(){ var h=hdr(); h['Prefer']='return=minimal';
            return _f(SB+'/rest/v1/intake_inbox',{method:'POST',headers:h,body:JSON.stringify({name:fl.name||'file',content:b64,bytes:fl.size})}); }); })
          .then(function(res){ window.__inboxN=(window.__inboxN||0)+(res.ok?1:0); return jres({ok:res.ok,cloud:true,reason:res.ok?'':('שגיאה '+res.status)}); })
          .catch(function(e){ return jres({ok:false,reason:String(e)}); }); }
      if(r.finddoc){ var lk=''; try{ lk=JSON.parse(init.body||'{}').link||''; }catch(_){} return Promise.resolve(jres({ok:!!lk, rel:lk})); }
      if(r.rpc==='state_post' && RO){ toastRO(); return Promise.resolve(jres({ok:true,version:(window._SHARED_VER||0),readonly:true})); }
      return fresh().then(function(){ return _f(SB+'/rest/v1/rpc/'+r.rpc,{method:'POST',headers:hdr(),body:(r.rpc==='state_post'?(init.body||'{}'):'{}'),keepalive:!!init.keepalive}); })
        .then(function(res){ if(res.status===401){ return refresh().then(function(){ return _f(SB+'/rest/v1/rpc/'+r.rpc,{method:'POST',headers:hdr(),body:(r.rpc==='state_post'?(init.body||'{}'):'{}')}); }); } return res; });
    };
    var P=XMLHttpRequest.prototype, XO=P.open, XS=P.send, XH=P.setRequestHeader;
    P.open=function(m,u,a){ var r=route(u,String(m||'GET').toUpperCase()); this.__cl=r;
      if(r&&r.rpc){ if(r.rpc==='state_post'&&RO){ r.rpc='state_version'; toastRO(); } return XO.call(this,'POST',SB+'/rest/v1/rpc/'+r.rpc, a!==false); }
      return XO.apply(this,arguments); };
    P.setRequestHeader=function(k,v){ if(this.__cl&&this.__cl.rpc&&/^content-type$/i.test(k)) return; return XH.apply(this,arguments); };
    P.send=function(b){ var r=this.__cl; if(r&&r.rpc){ var h=hdr(); for(var k in h) XH.call(this,k,h[k]); return XS.call(this,(r.rpc==='state_post'?(b||'{}'):'{}')); } return XS.apply(this,arguments); };
    if(navigator.sendBeacon){ var _sb=navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon=function(u,data){ var r=route(u,'POST'); if(!r) return _sb(u,data); if(r.none||r.portal||RO) return true;
        try{ var p=(data&&data.text)?data.text():Promise.resolve(String(data||'{}'));
          p.then(function(t){ window.fetch(u,{method:'POST',body:t,keepalive:true}); }); }catch(_){} return true; }; }
    setInterval(function(){ if(S && (S.expires_at||0)-Date.now()/1000 < 900) refresh().catch(function(){}); }, 60000);
  }


  /* ---- מסמכים (PDF/תמונות) מהאחסון בענן ---- */
  var DOCMAP=null, _docMapP=null, _blobs={};
  function docMap(){ if(DOCMAP) return Promise.resolve(DOCMAP); if(_docMapP) return _docMapP;
    var m={}; function page(off){ return fresh().then(function(){ return fetch(SB+'/rest/v1/doc_files?uploaded=is.true&select=path,okey&order=path&offset='+off+'&limit=1000',{headers:hdr()}); })
      .then(function(r){ if(!r.ok) throw new Error('docs '+r.status); return r.json(); })
      .then(function(rows){ rows.forEach(function(x){ m[x.path]=x.okey; }); return rows.length===1000?page(off+1000):m; }); }
    _docMapP=page(0).then(function(mm){ DOCMAP=mm; setTimeout(function(){ DOCMAP=null; _docMapP=null; },10*60*1000); return mm; },function(e){ _docMapP=null; throw e; });
    return _docMapP; }
  function relOf(u){ if(u==null) return null; u=String(u).trim(); if(!u||/^(https?:|data:|blob:|about:|javascript:|mailto:|#)/i.test(u)) return null;
    if(/^file:/i.test(u)) return null; u=u.split('#')[0].split('?')[0].replace(/^\.\//,''); try{ u=decodeURI(u); }catch(_){} return u||null; }
  function docBlob(rel){ if(_blobs[rel]) return _blobs[rel];
    var _pd=(window.__cloudPortalDoc&&window.__cloudPortalDoc(rel)); if(_pd){ _blobs[rel]=_pd; _pd.catch(function(){ delete _blobs[rel]; }); return _pd; }
    _blobs[rel]=docMap().then(function(m){ var k=m[rel]; if(!k){ var e=new Error('nofile'); e.nofile=true; throw e; }
      return fresh().then(function(){ return fetch(SB+'/storage/v1/object/authenticated/docs/'+k,{headers:{'apikey':KEY,'Authorization':'Bearer '+S.access_token}}); }); })
      .then(function(r){ if(!r.ok) throw new Error('storage '+r.status); return r.blob(); })
      .then(function(b){ return URL.createObjectURL(b); });
    _blobs[rel].catch(function(){ delete _blobs[rel]; });
    return _blobs[rel]; }
  function noFileHtml(rel){ return '<div style="padding:28px 18px;text-align:center;color:#7a4410;background:#fff6ea;border:1px dashed #f0c38f;border-radius:12px;font:14px Arial;direction:rtl;line-height:1.6">📄 הקובץ עוד לא הועלה לענן.<br><span style="font-size:12px;color:#9a7a5a">'+String(rel).replace(/[<>&]/g,'')+'</span><br><span style="font-size:12px">הקבצים עולים בהדרגה מהמחשב של איילת.</span></div>'; }
  function curViewLink(){ try{ return Function('try{return (viewList&&viewList[viewPos]&&viewList[viewPos].link)||""}catch(e){return ""}')(); }catch(_){ return ''; } }
  function fixEl(el){
    var tag=el.tagName; if(!tag) return; var attr=(tag==='OBJECT')?'data':'src';
    if(!/^(IFRAME|IMG|EMBED|OBJECT)$/.test(tag)) return;
    var raw=el.getAttribute(attr);
    if(raw && raw.indexOf(CB+'/preview')===0 && el.__clDone!==raw && window.__cloudPortalSrc){ el.__clDone=raw; el.setAttribute(attr,'about:blank'); el.__clDone='about:blank';
      window.__cloudPortalSrc(raw).then(function(u){ el.__clDone=u; el.setAttribute(attr,u); }).catch(function(){ el.style.display='none'; }); return; }
    var rel=relOf(raw); if(!rel || el.__clDone===raw) return;
    el.__clDone=raw;
    if(tag==='IMG' && /^תצוגות\//.test(rel)){
      /* תמונות תצוגה לא הועלו (חיסכון במקום) — מציגים את הקובץ המקורי במקומן */
      var box=el.closest&&el.closest('#ovDoc'); if(box && !box.__clPdf){ box.__clPdf=1; var lk=curViewLink();
        if(lk){ setTimeout(function(){ try{ box.__clPdf=0; if(typeof window.showFullPdf==='function') window.showFullPdf(encodeURIComponent(lk)); }catch(_){} },0); } }
      el.style.display='none'; return; }
    el.setAttribute(attr,'about:blank'); el.__clDone='about:blank';
    docBlob(rel).then(function(u){ el.__clDone=u; el.setAttribute(attr,u); })
      .catch(function(e){ if(tag==='IFRAME'){ try{ el.__clDone='x'; el.removeAttribute('src'); el.srcdoc='<meta charset=utf-8><body style="margin:0;background:#fff6ea">'+noFileHtml(rel); }catch(_){} } else { el.style.display='none'; } });
  }
  function scan(root){ try{ if(root.nodeType!==1) return; fixEl(root); var l=root.querySelectorAll('iframe,img,embed,object'); for(var i=0;i<l.length;i++) fixEl(l[i]); }catch(_){} }
  function openRel(rel, dl){
    var w=dl?null:window.open('about:blank','_blank');
    try{ if(w) w.document.write('<meta charset=utf-8><body style="font:16px Arial;direction:rtl;padding:30px;background:#f6efe4;color:#7a4410">טוענת את המסמך…</body>'); }catch(_){}
    docBlob(rel).then(function(u){
      if(dl){ var a=document.createElement('a'); a.href=u; a.download=dl; a.__clOk=1; document.body.appendChild(a); a.click(); a.remove(); }
      else if(w){ w.location=u; } else { window.open(u,'_blank'); }
    }).catch(function(){ if(w){ try{ w.document.body.innerHTML=noFileHtml(rel); }catch(_){} } else alert('הקובץ עוד לא הועלה לענן: '+rel); });
  }
  function installDocs(){
    try{ new MutationObserver(function(ms){ ms.forEach(function(m){ if(m.type==='attributes') fixEl(m.target); else for(var i=0;i<m.addedNodes.length;i++) scan(m.addedNodes[i]); }); })
      .observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','data']}); }catch(_){}
    scan(document.documentElement);
    document.addEventListener('click',function(e){ var a=e.target&&e.target.closest&&e.target.closest('a[href]'); if(!a||a.__clOk) return;
      var rel=relOf(a.getAttribute('href')); if(!rel) return; e.preventDefault(); e.stopPropagation();
      openRel(rel, a.hasAttribute('download')?(a.getAttribute('download')||rel.split('/').pop()):null); },true);
    var _wo=window.open; window.open=function(u){ if(typeof u==='string' && u.indexOf(CB+'/preview')===0 && window.__cloudPortalSrc){ var w0=_wo.call(window,'about:blank','_blank'); window.__cloudPortalSrc(u.replace('/preview_img/','/preview/')).then(function(b){ if(w0) w0.location=b; }); return w0; } var rel=relOf(u); if(rel && arguments.length<3){ openRel(rel,null); return null; } return _wo.apply(window,arguments); };
  }
  window.openGiul=function(link){ var rel=relOf(link); if(rel) openRel(rel,null); };

  /* ---- התאמות קטנות לקוד של שונטל (בלי לגעת בנתונים) ---- */
  function patch(h){
    var reps=[
      ['(location.protocol==="http:"||location.protocol==="https:")?location.origin:"http://localhost:8000"', '"'+CB+'"'],
      ['(location.protocol==="http:"||location.protocol==="https:")?location.origin:""', '"'+CB+'"'],
      ['!/^https?:/.test(location.protocol)', 'false']
    ];
    for(var i=0;i<reps.length;i++){ var n=h.split(reps[i][0]).length-1; if(n<1) throw new Error('התאמה '+(i+1)+' לא נמצאה'); h=h.split(reps[i][0]).join(reps[i][1]); }
    var banner='<div id="cloudBanner" style="position:fixed;top:10px;left:10px;z-index:2147483646;direction:rtl;font:13px Arial">'+
      '<div onclick="var m=this.nextSibling;m.style.display=(m.style.display===\'block\'?\'none\':\'block\')" title="שונטל בענן" style="width:34px;height:34px;border-radius:50%;background:#7461c8;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(60,50,110,.3);font-size:17px">☁️</div>'+
      '<div style="display:none;position:absolute;top:40px;left:0;min-width:240px;background:#fff;border:1px solid #e7e4ef;border-radius:12px;box-shadow:0 8px 24px rgba(40,30,80,.18);padding:10px 12px;color:#15121f;line-height:1.6">'+
      '<b>☁️ שונטל בענן</b><br><span>'+(RO?'גרסת בדיקה: צפייה בלבד.':'כל שינוי נשמר מיד ומשותף לכולם.')+'</span><br>'+
      '<span style="color:#454056">מחוברת: '+((S&&S.email)||'').replace(/[<>&"]/g,'')+'</span><br>'+
      '<a href="#" onclick="try{localStorage.removeItem(\''+SK+'\')}catch(_){};location.reload();return false" style="color:#7461c8;font-weight:700">יציאה</a></div></div>';
    var bi=h.search(/<body[^>]*>/i); if(bi<0) throw new Error('לא נמצא body');
    var be=h.indexOf('>',bi)+1; h=h.slice(0,be)+banner+h.slice(be);
    return h;
  }

  /* מטמון מקומי של קוד שונטל (IndexedDB) — מורידים מחדש רק כשיש גרסה חדשה */
  function idb(){ return new Promise(function(res,rej){ setTimeout(function(){ rej(new Error('idb-timeout')); },2500); try{ var q=indexedDB.open('shontal-cloud',1);
    q.onupgradeneeded=function(){ q.result.createObjectStore('f'); }; q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); }; }catch(e){ rej(e); } }); }
  function cget(k){ return idb().then(function(db){ return new Promise(function(res){ setTimeout(function(){ res(null); },4000); var t=db.transaction('f','readonly').objectStore('f').get(k); t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); }; }); }).catch(function(){ return null; }); }
  function cput(k,v){ return idb().then(function(db){ return new Promise(function(res){ setTimeout(function(){ res(false); },4000); var t=db.transaction('f','readwrite'); t.objectStore('f').put(v,k); t.oncomplete=function(){ res(true); }; t.onerror=function(){ res(false); }; }); }).catch(function(){ return false; }); }
  function gunzipB64(b64){
    var bin=atob(b64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    var ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(ds).text();
  }
  function rest(q){ return fetch(SB+'/rest/v1/'+q,{headers:hdr()}).then(function(r){
      if(r.status===401){ clearS(); throw new Error('ההתחברות פגה — נא להיכנס שוב'); }
      if(!r.ok) throw new Error('שגיאה בטעינה ('+r.status+')'); return r.json(); }); }
  function getApp(){
    return rest('app_files?name=in.(system.gz,system.html)&select=name,md5,updated_at').then(function(rows){
      if(!rows || !rows.length) throw new Error('למייל הזה אין הרשאה לשונטל. אם זו טעות — לפנות לאיילת.');
      var row=rows.filter(function(r){return r.name==='system.gz';})[0]||rows[0];
      return cget('app').then(function(c){
        if(c && c.md5===row.md5 && c.html){ return {html:c.html, updated:row.updated_at, cached:true}; }
        loadStep('מורידה גרסה מעודכנת של שונטל…');
        return rest('app_files?name=eq.'+row.name+'&select=content').then(function(r2){
          var txt=r2[0].content;
          return (row.name==='system.gz'?gunzipB64(txt):Promise.resolve(txt)).then(function(html){
            return cput('app',{md5:row.md5, html:html}).then(function(){ return {html:html, updated:row.updated_at, cached:false}; });
          });
        });
      });
    });
  }

  function start(){
    show('stLoad'); msg('');
    $('loadDone').textContent=''; $('loadTxt').textContent='מתחברת לענן…';
    fresh().then(function(){
      fetch(SB+'/rest/v1/rpc/my_display_name',{method:'POST',headers:hdr(),body:'{}'}).then(function(r){ return r.ok?r.json():null; })
        .then(function(n){ if(n&&typeof n==='string'){ try{ localStorage.setItem('shontal-cloud-name',n); }catch(_){} hello(); } },function(){});
      loadStep('בודקת שיש לך את הגרסה העדכנית…');
      /* 3.10.2026 — מצב הענן נקבע בשרת: readonly = צפייה בלבד, live = עבודה מלאה */
      return fetch(SB+'/rest/v1/rpc/cloud_mode_get',{method:'POST',headers:hdr(),body:'{}'})
        .then(function(r){ return r.ok?r.json():null; }).then(function(m){ RO=(m!=='live'); }, function(){ RO=true; })
        .then(function(){ return getApp(); });
    }).then(function(a){
      loadStep('פותחת את שונטל…');
      var html=patch(a.html);
      installShim();
      window.__SHONTAL_CLOUD={email:(S&&S.email)||'', updated:a.updated, readonly:RO, cached:a.cached, shell:2,
        api:{SB:SB, KEY:KEY, CB:CB, hdr:hdr, fresh:fresh}};
      return new Promise(function(r){ setTimeout(r,Math.max(0,1200-(Date.now()-T0))); }).then(function(){
      _loadedAt=Date.now(); document.open(); document.write(html); document.close();
      installDocs();
      try{ rest('app_files?name=eq.shell_patch.js&select=content').then(function(r){ var c=r&&r[0]&&r[0].content; if(c){ try{ (new Function('ctx',c))({SB:SB,KEY:KEY,CB:CB,hdr:hdr,fresh:fresh,refresh:refresh,route:route}); }catch(e){} } }).catch(function(){}); }catch(_){}
      if(!window.__cloudPortalReady) try{ window.inGlam=function(){ var i=document.getElementById('inGlamInfo'); var n=window.__inboxN||0; window.__inboxN=0;
        var t=n?('☁️ '+n+' קבצים הועלו לקליטה. הם יופיעו לאישור במסך הקליטה כשהפורטל במחשב של איילת פועל.'):'☁️ בשונטל בענן: גררי לכאן קבצים — הם נשמרים בענן ויופיעו לאישור כשהפורטל במחשב פועל.';
        if(i) i.textContent=t; else alert(t); }; }catch(_){}
      });
    }).catch(function(e){ show('stEmail'); msg(e.message||String(e),true); });
  }

  if(S && S.refresh_token){ start(); } else { show('stEmail'); }
})();
