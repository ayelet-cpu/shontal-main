<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מרכז הבקרה</title>
<meta name="theme-color" content="#14112b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='1' stop-color='%2337d6c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 22h28M18 32h20M18 42h24' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* מרכז הבקרה של איילת — 29.10.2026. קוד בלבד; הנתונים בענן (mc_notes / mc_files / mc_kv). */
:root{
  --bg:#eef0fa; --bg2:#e6e3f7;
  --blob1:#b9a9ff; --blob2:#8fe3d6; --blob3:#ffc2dc;
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.78); --glass-hi:rgba(255,255,255,.9);
  --line:rgba(80,70,150,.13); --line2:rgba(80,70,150,.22);
  --ink:#1d1a33; --ink2:#4b4766; --ink3:#7d7998;
  --acc:#6a57de; --acc2:#8b7bff; --acc-ink:#fff; --acc-soft:rgba(106,87,222,.12);
  --ok:#1f9d6a; --warn:#c27a12; --bad:#d6455a;
  --shadow:0 10px 34px rgba(46,36,120,.12), 0 1px 0 rgba(255,255,255,.7) inset;
  --blur:saturate(160%) blur(22px);
  --r:20px; --r2:14px; --r3:10px;
}
:root[data-theme="dark"]{
  --bg:#0f0d22; --bg2:#151233;
  --blob1:#5b44e0; --blob2:#0f8d86; --blob3:#9b2f72;
  --glass:rgba(255,255,255,.065); --glass2:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#f1efff; --ink2:#c3bfe0; --ink3:#8d89ad;
  --acc:#9b8cff; --acc2:#b8adff; --acc-ink:#120f2a; --acc-soft:rgba(155,140,255,.16);
  --ok:#4fd39b; --warn:#f0b452; --bad:#ff7688;
  --shadow:0 14px 40px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08) inset;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0d22; --bg2:#151233;
    --blob1:#5b44e0; --blob2:#0f8d86; --blob3:#9b2f72;
    --glass:rgba(255,255,255,.065); --glass2:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --ink:#f1efff; --ink2:#c3bfe0; --ink3:#8d89ad;
    --acc:#9b8cff; --acc2:#b8adff; --acc-ink:#120f2a; --acc-soft:rgba(155,140,255,.16);
    --ok:#4fd39b; --warn:#f0b452; --bad:#ff7688;
    --shadow:0 14px 40px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08) inset;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Heebo","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hid{display:none!important}

/* רקע — כתמי צבע רכים מאחורי הזכוכית */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%)}
.sky i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.75}
.sky i:nth-child(1){width:52vmax;height:52vmax;background:var(--blob1);top:-18vmax;right:-12vmax;animation:drift1 28s ease-in-out infinite alternate}
.sky i:nth-child(2){width:44vmax;height:44vmax;background:var(--blob2);bottom:-20vmax;left:-10vmax;animation:drift2 34s ease-in-out infinite alternate}
.sky i:nth-child(3){width:30vmax;height:30vmax;background:var(--blob3);top:38%;left:38%;opacity:.45;animation:drift3 40s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(9vmax,-5vmax) scale(1.1)}}
@keyframes drift3{to{transform:translate(-6vmax,-8vmax) scale(.9)}}
@media (prefers-reduced-motion: reduce){.sky i{animation:none}}

.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

.wrap{max-width:1360px;margin:0 auto;padding:18px 24px 60px}

/* כותרת */
.top{position:sticky;top:10px;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 16px 12px 12px;margin-bottom:18px}
.hello b{display:block;font-size:20px;font-weight:700;letter-spacing:-.2px}
.hello span{font-size:13px;color:var(--ink3)}
.search{flex:1;max-width:520px;margin-inline-start:auto;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);color:var(--ink3);transition:border-color .15s,box-shadow .15s}
.search:hover{border-color:var(--line2)}
.search span{flex:1;text-align:start;font-size:14px}
kbd{font-family:inherit;font-size:11.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--ink3);background:var(--glass)}
.status{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink2);background:var(--glass2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.warn{background:var(--warn)}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--glass2);color:var(--ink2);transition:background .15s,color .15s}
.ibtn:hover{background:var(--glass-hi);color:var(--ink)}
.ibtn svg{width:19px;height:19px}

/* קיצורים */
.links{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.lk{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 16px 0 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;transition:transform .15s,background .15s,border-color .15s}
.lk:hover{background:var(--glass2);border-color:var(--line2);transform:translateY(-1px)}
.lk .em{font-size:18px;line-height:1}
.lk.add{color:var(--ink3);font-weight:500;border-style:dashed}

.sec-h{display:flex;align-items:baseline;gap:12px;margin:6px 4px 12px}
.sec-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.1px}
.sec-h small{color:var(--ink3);font-size:12.5px}

/* מסעדות */
.rests{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:26px}
.rest{padding:16px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rest::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--rc)}
.rest-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rest-h .badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--rc);box-shadow:0 4px 14px color-mix(in srgb,var(--rc) 45%,transparent)}
.rest-h b{font-size:16.5px;font-weight:700;flex:1}
.rest-h .ibtn{width:32px;height:32px;border-radius:10px}
.rest-h .ibtn svg{width:16px;height:16px}
.sys-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.sys{text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);text-align:start;transition:transform .15s,background .15s,border-color .15s;min-width:0}
.sys:hover{background:var(--glass-hi);border-color:color-mix(in srgb,var(--rc) 55%,transparent);transform:translateY(-1px)}
.sys:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sys.off{opacity:.55}
.sys-i{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--rc) 18%,transparent)}
.sys-t{min-width:0}.sys-t b{display:block;font-size:15.5px;font-weight:700}.sys-t small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev{margin-top:10px;border:0;background:none;color:var(--ink2);font-size:13px;font-weight:500;padding:4px 2px;text-align:start}
.prev:hover{color:var(--acc)}
.rest-h .chip{height:28px;font-size:12px;text-decoration:none}
.sub-h{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.2px;margin:10px 2px 6px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:var(--glass);cursor:pointer;transition:background .12s,border-color .12s;min-width:0;text-align:start;width:100%}
.file:hover{background:var(--glass-hi);border-color:var(--line)}
.file:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ext{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.3px;color:#fff;background:#8a86a3}
.ext.x{background:#1f8f5a}.ext.p{background:#d6455a}.ext.w{background:#2f6fd6}.ext.s{background:#d0741f}.ext.l{background:#6a57de}.ext.h{background:#0f8d86}.ext.f{background:#b48a1f}
.fm{flex:1;min-width:0}
.fn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}
.fs{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{font-size:10.5px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);padding:1px 7px;border-radius:6px;margin-inline-start:6px}
.x-btn{flex:none;width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--ink3);opacity:0;display:grid;place-items:center;transition:opacity .12s,background .12s}
.file:hover .x-btn,.file:focus-within .x-btn{opacity:1}
.x-btn:hover{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
@media (hover:none){.x-btn{opacity:.6}}
.empty{font-size:13px;color:var(--ink3);padding:14px;border:1px dashed var(--line2);border-radius:12px;text-align:center}
.empty button{border:0;background:none;color:var(--acc);font-weight:600;padding:0}

/* מחברת */
.nb{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:560px;overflow:hidden;margin-bottom:26px}
.nb-side{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nb-side-h{display:flex;gap:8px;padding:14px}
.nb-q{flex:1;min-width:0;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--glass2);padding:0 12px;outline:none}
.nb-q:focus{border-color:var(--acc)}
.btn{height:38px;padding:0 16px;border-radius:11px;border:1px solid transparent;background:var(--acc);color:var(--acc-ink);font-weight:600;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--glass2);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--glass-hi);filter:none}
.btn.danger{background:var(--bad);color:#fff}
.nb-list{flex:1;overflow:auto;padding:0 8px 12px;max-height:620px}
.nl{display:block;width:100%;text-align:start;border:0;background:transparent;padding:10px 12px;border-radius:12px;margin-bottom:2px;transition:background .12s}
.nl:hover{background:var(--glass)}
.nl.on{background:var(--acc-soft)}
.nl b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nl .sw{width:9px;height:9px;border-radius:3px;flex:none;border:1px solid var(--line2)}
.nb-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.nb-tb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tb{min-width:34px;height:34px;padding:0 8px;border-radius:9px;border:0;background:transparent;color:var(--ink2);font-weight:600;display:inline-grid;place-items:center}
.tb:hover{background:var(--glass2);color:var(--ink)}
.tb.on{background:var(--acc-soft);color:var(--acc)}
.tb svg{width:17px;height:17px}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.tb input[type=color]{width:0;height:0;opacity:0;position:absolute}
.nb-title{border:0;outline:none;background:transparent;font-size:22px;font-weight:700;padding:18px 22px 4px;width:100%}
.nb-meta{font-size:12px;color:var(--ink3);padding:0 22px 8px;display:flex;gap:10px}
.nb-page{position:relative;flex:1;overflow:auto;margin:0 12px 12px;border-radius:14px;transition:background .2s}
.nb-body{min-height:100%;outline:none;padding:10px 12px 40px;font-size:15.5px;line-height:1.65}
.nb-body:empty::before{content:"כתבי כאן… אפשר להדביק צילום מסך (Ctrl+V)";color:var(--ink3)}
.nb-body img{max-width:100%;height:auto;border-radius:10px}
.nb-body table{border-collapse:collapse}.nb-body td,.nb-body th{border:1px solid var(--line2);padding:4px 8px}
.nb-body ul.chk{list-style:none;padding-inline-start:4px}
.nb-body ul.chk li{position:relative;padding-inline-start:28px}
.nb-body ul.chk li::before{content:"";position:absolute;inset-inline-start:0;top:.3em;width:17px;height:17px;border-radius:5px;border:1.6px solid var(--ink3);cursor:pointer}
.nb-body ul.chk li.done{color:var(--ink3);text-decoration:line-through}
.nb-body ul.chk li.done::before{background:var(--acc);border-color:var(--acc);content:"✓";color:var(--acc-ink);font-size:12px;line-height:16px;text-align:center;font-weight:800}
.nb-overlay{position:absolute;top:0;right:0;pointer-events:none;max-width:100%}
.nb-none{flex:1;display:grid;place-items:center;color:var(--ink3);padding:40px;text-align:center}
.colors{display:flex;gap:6px;padding:4px}
.cbtn{width:22px;height:22px;border-radius:7px;border:1px solid var(--line2)}

/* חלונות */
.mask{position:fixed;inset:0;z-index:50;background:rgba(15,12,35,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.dlg{width:100%;max-width:620px;max-height:80vh;display:flex;flex-direction:column;background:var(--glass2);overflow:hidden}
:root[data-theme="dark"] .dlg{background:rgba(30,26,60,.82)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dlg{background:rgba(30,26,60,.82)}}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h b{flex:1;font-size:16px}
.dlg-q{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 18px;font-size:16px;outline:none}
.dlg-b{overflow:auto;padding:10px}
.dlg-f{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:transparent;padding:9px 10px;border-radius:12px}
.res:hover,.res.sel{background:var(--acc-soft)}
.res .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink2);flex:none}
.grp{font-size:11.5px;font-weight:700;color:var(--ink3);padding:10px 10px 4px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.fld input,.fld select{width:100%;height:42px;border-radius:11px;border:1px solid var(--line2);background:var(--glass);padding:0 12px;outline:none}
.fld input:focus{border-color:var(--acc)}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.tab{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
/* הערות שכר פאסטל */
.sn{padding:14px;margin-bottom:22px}
.sn-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.sn-bar .tabs{padding:0;flex:1;flex-wrap:wrap}
.sn-sel{height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--glass);padding:0 10px;color:var(--ink)}
.sn-list{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sn-item{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--glass2)}
.sn-top{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink3)}
.sn-main{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px;font-size:15px}
.sn-main b{font-weight:700}
.sn-tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.sn-amt{font-weight:700}
.sn-det{color:var(--ink2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.sn-orig summary{cursor:pointer;color:var(--ink3);font-size:12.5px;margin-top:6px}
.sn-orig div{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--ink2);padding:6px 0 0}
.sn-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sn-act .btn{height:32px;padding:0 12px;font-size:13px}
.sn-empty{color:var(--ink3);padding:18px;text-align:center}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.note{font-size:13px;color:var(--ink2);background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;font-size:14px;background:var(--glass2);max-width:calc(100% - 32px)}
:root[data-theme="dark"] .toast{background:rgba(30,26,60,.9)}
.toast button{border:0;background:var(--acc-soft);color:var(--acc);font-weight:700;border-radius:9px;padding:5px 12px}

/* כניסה */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:30px 28px}
.login h1{margin:0 0 4px;font-size:24px}
.login p{margin:0 0 18px;color:var(--ink2);font-size:14px}
.login .btn{width:100%;height:46px;margin-top:4px}
.msg{min-height:20px;font-size:13px;color:var(--ink2);margin-top:12px}
.msg.err{color:var(--bad)}

@media (max-width:860px){
  .wrap{padding:12px 16px 50px}
  .top{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .status .chip span.lbl{display:none}
  .nb{grid-template-columns:minmax(0,1fr)}
  .top{position:relative;top:0}
  .rest{min-height:0}
  .nb-page{min-height:320px}
  .nb-side{border-inline-end:0;border-bottom:1px solid var(--line)}
  .nb-list{max-height:220px}
  .rests{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- כניסה -->
<div id="vLogin" class="login hid">
  <div class="card glass">
    <h1>מרכז הבקרה</h1>
    <p>כניסה עם קוד שנשלח למייל</p>
    <div id="stEmail">

    .then(function(r){ return r.text().then(function(t){ var j={}; try{ j=JSON.parse(t||'{}'); }catch(_){}
      if(!r.ok){ var e=new Error(j.msg||j.error_description||j.message||('שגיאה '+r.status)); e.status=r.status; throw e; } return j; }); });
}
function keep(j){ saveS({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:(j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)),email:(j.user&&j.user.email)||(S&&S.email)||''}); }

}

/* ---------- מצב ---------- */
var KV={rest_files:{},general:[],sites:[],extra_folders:[],recent:[]};

function kvSave(k){ return api('POST','mc_kv',{k:k,v:KV[k],updated_at:new Date().toISOString()},{'Prefer':'resolution=merge-duplicates,return=minimal'}).catch(function(e){ toast('לא נשמר: '+e.message); }); }

  return api('GET','mc_kv?select=k,v').then(function(rows){
    (rows||[]).forEach(function(r){ if(r.k==='files_synced_at') SYNCED=r.v; else KV[r.k]=r.v; });

/* ---------- זמן ---------- */
var DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function ago(t){
  if(!t) return ''; var d=(Date.now()-new Date(t).getTime())/1000;
  if(d<60) return 'עכשיו'; if(d<3600) return 'לפני '+Math.round(d/60)+' דק׳';
  if(d<86400) return 'לפני '+Math.round(d/3600)+' שע׳';
  var dd=Math.round(d/86400); if(dd===1) return 'אתמול'; if(dd<30) return 'לפני '+dd+' ימים';
  var x=new Date(t); return x.getDate()+'.'+(x.getMonth()+1)+'.'+String(x.getFullYear()).slice(2);
}
function isToday(t){ if(!t) return false; var a=new Date(t), b=new Date(); return a.toDateString()===b.toDateString(); }
function tick(){
  var d=new Date(), h=d.getHours();
  var g=h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';
  $('hHello').textContent=g+', איילת';
  $('hDate').textContent='יום '+DAYS[d.getDay()]+', '+d.getDate()+' ב'+MONTHS[d.getMonth()]+' · '+String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  var c=$('cSync'), dot=c.querySelector('.dot'), l=c.querySelector('.lbl');
  if(SYNCED){ var old=(Date.now()-new Date(SYNCED).getTime())>3600e3; dot.className='dot '+(old?'warn':'ok'); l.textContent='קבצים: '+ago(SYNCED);
    c.title=old?'המחשב לא שלח רשימת קבצים יותר משעה — כנראה שהפורטל כבוי':'רשימת הקבצים עדכנית'; }
  else { dot.className='dot warn'; l.textContent='קבצים: עוד לא נשלחו'; c.title='כשהפורטל במחשב ירוץ, הוא ישלח את רשימת הקבצים'; }
}

}

    fetch(PORTAL+'/mc/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:t})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok||!j.ok) throw new Error(j.reason||('שגיאה '+r.status)); }); })

/* ---------- סמלי קבצים ---------- */
function extOf(n){ var m=/\.([a-z0-9]+)$/i.exec(n||''); return m?m[1].toLowerCase():''; }

/* ---------- מסעדות ---------- */
function restKey(nm){ return nm==='כללי'?'general':nm; }
function pinsOf(nm){ return nm==='כללי'?(KV.general||[]):((KV.rest_files||{})[nm]||[]); }
function setPins(nm,a){ if(nm==='כללי'){ KV.general=a; kvSave('general'); } else { KV.rest_files[nm]=a; kvSave('rest_files'); } }
function rootPath(nm){ var f=null; for(var i=0;i<FILES.length;i++){ if(FILES[i].root===nm){ f=FILES[i]; break; } } if(!f) return ''; var p=f.path; var rel=f.rel?f.rel.length+1:0; return p.slice(0,p.length-f.name.length-1-rel).replace(/[\\/]$/,''); }
/* ---------- מערכות: שכר + רווח והפסד לכל מסעדה ----------
   הקבצים מגיעים מהפורטל (סריקת «האחסון שלי»). רק שם מדויק נחשב — עותקי גיבוי («לפני…», «שבור», bak, (1)) לא. */
var SAL_RE=/^בקרת שכר (.+?) (\d{2})\.(\d{4})\.html$/;
var PNL_RE=/^רווח והפסד (.+?) - קלוד\.html$/;
var SAL_OF={'פאסטל':['פאסטל'],'אריאלה וטופול':['אריאלה','טופול'],'אסא':['אסא'],'פינצוס':["צ'אקולי"],"צ'אקולי":["צ'אקולי"],'צאקולי':["צ'אקולי"]};
var PNL_OF={'פאסטל':'פאסטל','אריאלה':'אריאלה','טופול':'טופול','סינמה':'טופול','אסא':'אסא','צאקולי':"צ'אקולי","צ'אקולי":"צ'אקולי"};
var CLOUD_SAL={'אסא':1,"צ'אקולי":1};
/* רווח והפסד עבר לענן (29.10.2026) — נפתח מכל מקום, בלי המחשב */
/* בקרת שכר בענן (29.10.2026) — כל המסעדות (צ'אקולי = פינצוס) */
var PAY_KEY={'פאסטל':'pastel','אריאלה':'cafe','טופול':'cafe','אסא':'asa',"צ'אקולי":'pincus'};
var PNL_KEY={'פאסטל':'pastel','אריאלה':'ariela','טופול':'topol','אסא':'asa',"צ'אקולי":'chakoli'};
var HEB_M=['','ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function systems(){
  var sal={}, pnl={};
  FILES.forEach(function(f){
    var m=SAL_RE.exec(f.name), k;
    if(m&&SAL_OF[m[1]]){ k=m[3]+m[2];
      SAL_OF[m[1]].forEach(function(r){ var a=sal[r]||(sal[r]={}); if(!a[k]||a[k].mtime<f.mtime) a[k]={path:f.path,name:f.name,mtime:f.mtime,mon:+m[2],yr:+m[3],key:k}; }); return; }
    m=PNL_RE.exec(f.name);
    if(m&&PNL_OF[m[1]]){ var r=PNL_OF[m[1]]; if(!pnl[r]||pnl[r].mtime<f.mtime) pnl[r]={path:f.path,name:f.name,mtime:f.mtime}; }
  });
  var out={};
  Object.keys(sal).forEach(function(r){ out[r]=out[r]||{}; out[r].sal=Object.keys(sal[r]).sort().reverse().map(function(k){ return sal[r][k]; }); });
  Object.keys(pnl).forEach(function(r){ out[r]=out[r]||{}; out[r].pnl=pnl[r]; });
  return out;
}
function sysBtn(kind,item,label,sub){
  var icon=kind==='sal'?'💰':'📊';
  if(!item) return '<div class="sys off"><span class="sys-i">'+icon+'</span><span class="sys-t"><b>'+label+'</b><small>'+(FILES.length?'לא נמצא':'מחכה לרשימה מהמחשב')+'</small></span></div>';
  return '<button class="sys" data-open="'+esc(item.path)+'" data-nm="'+esc(bare(item.name))+'" data-sys="1" title="'+esc(item.name)+'"><span class="sys-i">'+icon+'</span><span class="sys-t"><b>'+label+'</b><small>'+esc(sub)+'</small></span></button>';
}
function renderRests(){
  var SY=systems(), h='';
  RESTS.forEach(function(r){
    if(r.nm==='כללי') return;
    var s=SY[r.nm]||{}, sal=s.sal||[], cur=sal[0];
    h+='<article class="rest glass" style="--rc:'+r.c+'"><div class="rest-h"><span class="badge">'+esc(r.nm.replace("'",'').charAt(0))+'</span><b>'+esc(r.nm)+'</b>'+
      (CLOUD_SAL[r.nm]?'<a class="chip" href="https://ayelet-cpu.github.io/" target="_blank" rel="noopener" title="פנקס העובדים והערות השכר של אסא וצ׳אקולי">📒 פנקס והערות שכר</a>':'')+'</div>';
    h+='<div class="sys-row">'+
      (PAY_KEY[r.nm]?'<a class="sys" href="pay.html?s='+PAY_KEY[r.nm]+'" target="_blank" rel="noopener"><span class="sys-i">💰</span><span class="sys-t"><b>שכר</b><small>☁ בענן · בחירת חודש בפנים</small></span></a>'
        :sysBtn('sal',cur,'שכר',cur?(HEB_M[cur.mon]+' '+cur.yr+' · '+ago(cur.mtime)):''))+
      (PNL_KEY[r.nm]?'<a class="sys" href="pnl.html?r='+PNL_KEY[r.nm]+'" target="_blank" rel="noopener"><span class="sys-i">📊</span><span class="sys-t"><b>רווח והפסד</b><small>☁ בענן · נפתח מכל מקום</small></span></a>'
        :sysBtn('pnl',s.pnl,'רווח והפסד',s.pnl?'עודכן '+ago(s.pnl.mtime):''))+'</div>';
    if(sal.length>1&&!PAY_KEY[r.nm]) h+='<button class="prev" data-prev="'+esc(r.nm)+'">חודשים קודמים בשכר ('+(sal.length-1)+') ›</button>';
    h+='</article>';
  });
  /* «כללי» ותיקיות נוספות — רק אם נשארו בהם קבצים שבחרת */
  var extra=[{nm:'כללי',c:'#0f9d95'}].concat((KV.extra_folders||[]).map(function(x){ return {nm:x.name,c:'#7d7998'}; }));
  extra.forEach(function(r){ var pins=pinsOf(r.nm); if(!pins.length) return;
    h+='<article class="rest glass" style="--rc:'+r.c+'"><div class="rest-h"><span class="badge">'+esc(r.nm.charAt(0))+'</span><b>'+esc(r.nm)+'</b></div><div class="files">';
    pins.forEach(function(p,i){ h+=fileRow(p,{rm:r.nm+'\u0001'+i}); }); h+='</div></article>'; });
  $('rests').innerHTML=h;
  $('restsHint').textContent='רווח והפסד ושכר — בענן, נפתחים מכל מקום';
}

});

function pickDialog(nm){
  var scope=nm;
  var m=dialog('<div class="dlg glass" role="dialog" aria-label="בחירת קובץ"><div class="dlg-h"><b>הוספת קובץ — '+esc(nm)+'</b><button class="ibtn" data-x>'+xSvg+'</button></div>'+
    '<div class="tabs"><button class="tab on" data-sc="'+esc(nm)+'">'+esc(nm)+'</button><button class="tab" data-sc="*">כל התיקיות</button></div>'+
    '<input class="dlg-q" id="pq" placeholder="חיפוש לפי שם קובץ או תיקייה"><div class="dlg-b" id="pr"></div>'+
    '<div class="dlg-f"><button class="btn ghost" id="pLink">+ קישור או נתיב אחר</button></div></div>');
  function draw(){
    var q=($('pq').value||'').trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean);
    var list=FILES.filter(function(f){ if(scope!=='*'&&f.root!==scope) return false; var s=(f.name+' '+f.rel).toLowerCase(); return words.every(function(w){ return s.indexOf(w)>=0; }); }).slice(0,80);
    var h=list.map(function(f,i){ return '<button class="res" data-i="'+i+'">'+extBadge(f.path,f.ext)+'<div class="fm"><div class="fn">'+esc(bare(f.name))+'</div><div class="fs">'+esc((scope==='*'?f.root+' · ':'')+(f.rel||'')+' · '+ago(f.mtime))+'</div></div></button>'; }).join('');
    if(!FILES.length) h='<div class="empty">רשימת הקבצים עוד לא הגיעה מהמחשב. כשהפורטל ירוץ במחשב (כמו תמיד), הקבצים יופיעו כאן תוך כמה דקות. בינתיים אפשר להוסיף קישור או נתיב ידנית.</div>';
    else if(!list.length) h='<div class="empty">לא נמצא קובץ מתאים</div>';
    $('pr').innerHTML=h;
    $('pr').onclick=function(e){ var b=e.target.closest('[data-i]'); if(!b) return; var f=list[+b.getAttribute('data-i')];

  }
  m.querySelector('[data-x]').onclick=closeLayer;

  $('pq').oninput=draw; $('pq').focus(); draw();
  $('pLink').onclick=function(){ linkDialog('הוספה ל'+nm,function(it){ var p=pinsOf(nm).slice(); p.push(it); setPins(nm,p); renderRests(); }); };

function searchDialog(){
  var m=dialog('<div class="dlg glass" role="dialog" aria-label="חיפוש"><input class="dlg-q" id="sq" placeholder="מה לחפש? שם קובץ, פתק, קיצור…" autocomplete="off"><div class="dlg-b" id="sr"></div></div>');

  function draw(){
    var q=($('sq').value||'').trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean), h='';
    items=[];
    function match(s){ s=(s||'').toLowerCase(); return words.every(function(w){ return s.indexOf(w)>=0; }); }
    if(!words.length){
      (KV.recent||[]).slice(0,8).forEach(function(r){ items.push({k:'open',nm:r.nm,target:r.target,sub:'פתחת '+ago(r.at),grp:'פתחת לאחרונה'}); });

    } else {
      FIXED_LINKS.concat(KV.sites||[]).filter(function(l){ return match(l.nm); }).forEach(function(l){ items.push({k:'open',nm:l.nm,target:l.target,sub:'קיצור',grp:'קיצורים'}); });
      NOTES.filter(function(n){ return match(n.title+' '+txt(n.body)); }).slice(0,8).forEach(function(n){ items.push({k:'note',id:n.id,nm:n.title||'ללא כותרת',sub:ago(n.updated_at),grp:'פתקים'}); });
      FILES.filter(function(f){ return match(f.name+' '+f.rel+' '+f.root); }).slice(0,40).forEach(function(f){ items.push({k:'open',nm:f.name,target:f.path,ext:f.ext,sub:f.root+(f.rel?' · '+f.rel:'')+' · '+ago(f.mtime),grp:'קבצים'}); });
    }
    if(sel>=items.length) sel=Math.max(0,items.length-1);
    var g='';
    items.forEach(function(it,i){ if(it.grp!==g){ g=it.grp; h+='<div class="grp">'+esc(g)+'</div>'; }
      h+='<button class="res'+(i===sel?' sel':'')+'" data-i="'+i+'">'+(it.k==='note'?'<span class="ext l">📝</span>':extBadge(it.target,it.ext))+'<div class="fm"><div class="fn">'+esc(it.k==='note'?it.nm:bare(it.nm))+'</div><div class="fs">'+esc(it.sub||'')+'</div></div></button>'; });
    if(!items.length) h='<div class="empty">'+(words.length?'לא נמצא כלום':'עוד אין היסטוריה')+'</div>';
    $('sr').innerHTML=h;
    var s=$('sr').querySelector('.sel'); if(s) s.scrollIntoView({block:'nearest'});
  }
  function go(i){ var it=items[i]; if(!it) return; closeLayer(); if(it.k==='note'){ selectNote(it.id); $('nb').scrollIntoView({behavior:'smooth',block:'start'}); } else openItem(it); }
  $('sq').oninput=function(){ sel=0; draw(); };
  $('sq').onkeydown=function(e){ if(e.key==='ArrowDown'){ sel=Math.min(items.length-1,sel+1); draw(); e.preventDefault(); } else if(e.key==='ArrowUp'){ sel=Math.max(0,sel-1); draw(); e.preventDefault(); } else if(e.key==='Enter'){ go(sel); } };
  $('sr').onclick=function(e){ var b=e.target.closest('[data-i]'); if(b) go(+b.getAttribute('data-i')); };
  $('sq').focus(); draw();
}

/* ייבוא מ-mission-control-data.json של ה-HTA */
function importOld(file){
  var rd=new FileReader();
  rd.onload=function(){
    var u8=new Uint8Array(rd.result||new ArrayBuffer(0)), enc='utf-8';
    /* ה-HTA שומר ב-UTF-16 (עם או בלי סימן בתחילת הקובץ) */
    if(u8[0]===0xFF&&u8[1]===0xFE) enc='utf-16le'; else if(u8[0]===0xFE&&u8[1]===0xFF) enc='utf-16be'; else if(u8.length>3&&u8[1]===0&&u8[3]===0) enc='utf-16le';
    var t=new TextDecoder(enc).decode(u8).replace(/^\uFEFF/,''), D=null;
    try{ D=JSON.parse(t); }catch(_){ var wd=t.indexOf(',"waDigest"'); if(wd>0){ try{ D=JSON.parse(t.slice(0,wd)+'}'); }catch(__){} } }
    if(!D){ toast('הקובץ לא נקרא — האם זה mission-control-data.json?'); return; }
    var nn=0, nf=0, ns=0;
    function same(a,b){ return a.target===b.target; }
    function addTo(arr,items){ items.forEach(function(it){ if(it&&it.target&&!arr.some(function(x){ return same(x,it); })){ arr.push({nm:it.nm||String(it.target).split(/[\\/]/).pop(),target:it.target}); nf++; } }); }

function hash(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36)+'-'+s.length; }

/* ---------- מחברת ---------- */
var CUR=null, dirty=false, saveT=null, lastPull=null, saving=null;
var PAGE_COLORS=['','#fff8d6','#e9f7ef','#eaf1ff','#fdecef','#f1ecfd','#1e1b3a'];
function clean(html){
  var d=document.createElement('div'); d.innerHTML=html||'';
  d.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(function(x){ x.remove(); });
  d.querySelectorAll('*').forEach(function(el){ Array.prototype.slice.call(el.attributes).forEach(function(a){
    if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name); }); });
  return d.innerHTML;
}
function plain(html){ var d=document.createElement('div'); d.innerHTML=(html||'').replace(/<img[^>]*>/gi,' 🖼 ').replace(/<(br|\/p|\/div|\/li)>/gi,' '); return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function loadNotes(full){
  var q='mc_notes?select=*&order=updated_at.asc';
  if(!full&&lastPull) q+='&updated_at=gt.'+encodeURIComponent(lastPull);
  else q+='&deleted=is.false';
  return api('GET',q).then(function(rows){
    if(full) NOTES=[];
    (rows||[]).forEach(function(r){
      if(!lastPull||r.updated_at>lastPull) lastPull=r.updated_at;
      var i=NOTES.findIndex(function(n){ return n.id===r.id; });
      if(CUR===r.id&&dirty) return;                       /* באמצע כתיבה — לא דורסים */
      if(r.deleted){ if(i>=0) NOTES.splice(i,1); if(CUR===r.id){ CUR=null; } return; }
      if(i>=0) NOTES[i]=r; else NOTES.push(r);
      if(CUR===r.id) fillEditor(true);

    renderNoteList(); if(!CUR&&NOTES.length) selectNote(sortedNotes()[0].id); else if(!NOTES.length) showEditor(false);

}
function sortedNotes(){ return NOTES.slice().sort(function(a,b){ return (b.star-a.star)||(b.updated_at>a.updated_at?1:b.updated_at<a.updated_at?-1:0); }); }

function markDirty(){ var n=curNote(); if(!n) return; dirty=true; $('nbSaved').textContent='שומרת…'; clearTimeout(saveT); saveT=setTimeout(saveNow,700); }

    .then(function(r){ if(r&&r[0]) n.updated_at=r[0].updated_at; },function(e){ toast('לא נשמר: '+e.message); }); }

/* תמונות — הדבקה / גרירה / בחירה. מוקטנות כדי שהפתק יישאר קל */
function shrink(file){ return new Promise(function(res,rej){
  var url=URL.createObjectURL(file), im=new Image();
  im.onload=function(){ var max=1600, w=im.naturalWidth, h=im.naturalHeight, k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url); var out=c.toDataURL('image/webp',.82); if(out.indexOf('data:image/webp')!==0) out=c.toDataURL('image/jpeg',.85); res(out); };
  im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('תמונה לא נקראה')); }; im.src=url; }); }
function insertImages(files){
  $('nbBody').focus();
  files.reduce(function(p,f){ return p.then(function(){ return shrink(f).then(function(src){ document.execCommand('insertHTML',false,'<img src="'+src+'" alt=""><br>'); }); }); },Promise.resolve())
    .then(markDirty,function(e){ toast(e.message); });
}
$('nbBody').addEventListener('paste',function(e){
  var cd=e.clipboardData; if(!cd) return;
  var imgs=Array.prototype.filter.call(cd.files||[],function(f){ return /^image\//.test(f.type); });
  if(imgs.length){ e.preventDefault(); insertImages(imgs); return; }
  var h=cd.getData('text/html'); if(h){ e.preventDefault(); document.execCommand('insertHTML',false,clean(h).replace(/<img[^>]+src="(?!data:)[^"]*"[^>]*>/gi,'')); }
});
$('nbBody').addEventListener('drop',function(e){ var fs=Array.prototype.filter.call((e.dataTransfer&&e.dataTransfer.files)||[],function(f){ return /^image\//.test(f.type); }); if(fs.length){ e.preventDefault(); insertImages(fs); } });
$('imgPick').onchange=function(){ var fs=Array.prototype.slice.call(this.files||[]); this.value=''; if(fs.length) insertImages(fs); };

/* ---------- הודעה קטנה ---------- */
var toastT=null;
function toast(t,undo){
  clearTimeout(toastT); var l=document.getElementById('toast'); if(l) l.remove();
  var d=document.createElement('div'); d.id='toast'; d.className='toast glass'; d.setAttribute('role','status');
  d.innerHTML='<span>'+esc(t)+'</span>'+(undo?'<button>בטלי</button>':''); document.body.appendChild(d);
  if(undo) d.querySelector('button').onclick=function(){ d.remove(); undo(); };
  toastT=setTimeout(function(){ d.remove(); },undo?7000:3500);
}

/* ---------- הערות שכר פאסטל (mc_salary_notes) — הבוט כותב, איילת מטפלת ---------- */
var SN=[], snTab='pending', snMon='', snSig='';
var SN_TOPICS=['בונוס','מקדמה','קיזוז','תוספת','העלאת שכר','חופש','מחלה','מילואים','עובד חדש','עזיבה','טיפים','מסמך','אחר'];
var SN_TABS=[['pending','ממתינות'],['done','הועבר לשכר'],['dismissed','לא רלוונטי'],['all','הכל']];
function snMonthOf(n){ if(n.month) return n.month; var d=new Date(n.ts); return d.getMonth()+1; }
function snAmt(a){ return a==null||a===''?'':Number(a).toLocaleString('he-IL')+' ₪'; }
function loadSN(){
  return api('GET','mc_salary_notes?select=id,ts,sender,from_me,msg_text,emp,topic,amount,month,detail,file_id,file_name,status&order=ts.desc&limit=500')
    .then(function(rows){ SN=rows||[]; var sig=JSON.stringify(SN); if(sig!==snSig){ snSig=sig; renderSN(); } });
}
function snShown(){
  return SN.filter(function(n){ return (snTab==='all'||n.status===snTab) && (!snMon||String(snMonthOf(n))===snMon); });
}
function renderSN(){
  var cnt={pending:0,done:0,dismissed:0,all:SN.length};
  SN.forEach(function(n){ cnt[n.status]=(cnt[n.status]||0)+1; });
  $('snTabs').innerHTML=SN_TABS.map(function(t){ return '<button class="tab'+(snTab===t[0]?' on':'')+'" data-snt="'+t[0]+'">'+t[1]+' ('+(cnt[t[0]]||0)+')</button>'; }).join('');
  var mons={}; SN.forEach(function(n){ mons[snMonthOf(n)]=1; });
  $('snMonth').innerHTML='<option value="">כל החודשים</option>'+Object.keys(mons).sort(function(a,b){ return b-a; })
    .map(function(m){ return '<option value="'+m+'"'+(snMon===m?' selected':'')+'>'+HEB_M[m]+'</option>'; }).join('');

    var who=n.from_me?'את':(n.sender||'רועי'), st=n.status==='done'?' · ✓ הועבר לשכר':n.status==='dismissed'?' · לא רלוונטי':'';
    var h='<article class="sn-item" data-sn="'+n.id+'">';
    h+='<div class="sn-top"><span>'+esc(when)+'</span><span>'+esc(who)+'</span><span>חודש '+esc(HEB_M[snMonthOf(n)])+'</span><span>'+st.replace(/^ · /,'')+'</span></div>';
    h+='<div class="sn-main"><b>'+esc(n.emp||'לא צוין עובד')+'</b><span class="sn-tag">'+esc(n.topic||'אחר')+'</span>'+(n.amount!=null?'<span class="sn-amt">'+esc(snAmt(n.amount))+'</span>':'')+'</div>';
    if(n.detail) h+='<div class="sn-det">'+esc(n.detail)+'</div>';

    h+='<div class="sn-act">';

  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ toast('הועתק — אפשר להדביק בוואטסאפ או במייל'); },function(){ toast('ההעתקה לא הצליחה'); });
}
$('snTabs').addEventListener('click',function(e){ var b=e.target.closest('[data-snt]'); if(!b) return; snTab=b.getAttribute('data-snt'); renderSN(); });
$('snMonth').addEventListener('change',function(){ snMon=this.value; renderSN(); });
$('snCopy').addEventListener('click',snCopy);
$('snList').addEventListener('click',function(e){
  var b=e.target.closest('[data-sna]'); if(!b) return; var n=snFind(b.closest('[data-sn]').getAttribute('data-sn')); if(!n) return;
  var a=b.getAttribute('data-sna');
  if(a==='file') snFile(n);
  else if(a==='edit') snEdit(n);
  else snPatch(n,{status:a},a==='done'?'סומן «הועבר לשכר»':a==='dismissed'?'סומן «לא רלוונטי»':'הוחזר לממתינות');
});

/* ---------- רענון לבד ---------- */
var pollT=null, lastSig='';
function refreshAll(){
  if(document.hidden) return Promise.resolve();
  loadSN().catch(function(){});
  return Promise.all([loadKV(),loadFiles(),loadNotes(false),pingPc()]).then(function(){
    var sig=JSON.stringify([KV.sites,KV.rest_files,KV.general,KV.extra_folders])+'|'+FILES.length+'|'+(FILES[0]&&FILES[0].mtime)+'|'+SYNCED+'|'+PC;
    if(sig!==lastSig&&!$('mask')){ lastSig=sig; renderLinks(); renderRests(); } tick(); },function(){});
}
function start(){
  $('vLogin').classList.add('hid'); $('vApp').classList.remove('hid'); tick();
  Promise.all([loadKV(),loadFiles(),pingPc()]).then(function(){ renderLinks(); renderRests(); tick(); })
    .catch(function(e){ toast('בעיה בטעינה: '+e.message); });
  loadNotes(true).catch(function(e){ toast('הפתקים לא נטענו: '+e.message); });
  loadSN().catch(function(e){ $('snList').innerHTML='<div class="sn-empty">הערות השכר לא נטענו: '+esc(e.message)+'</div>'; });
  clearInterval(pollT); pollT=setInterval(refreshAll,30000);
  setInterval(tick,20000);
  window.addEventListener('focus',refreshAll);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refreshAll(); });
}
if(S&&S.refresh_token) start(); else showLogin();
})();
</script>
