<style>
/* רווח והפסד בענן — 29.10.2026. העמוד הזה רק טוען: הקוד של כל מסעדה (pl_code) + הנתונים (pl_docs) מהענן,
   ומריץ אותם כמו שהם בתוך מסגרת. «שמירה אוטומטית» של המערכת שומרת לענן (pl_save) במקום לקובץ. */
:root{--bg:#f4f3fb;--bar:rgba(255,255,255,.86);--line:rgba(80,70,150,.16);--ink:#1d1a33;--ink2:#5b5776;--acc:#6a57de;--ok:#1f9d6a;--warn:#c27a12;--bad:#d6455a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0d22;--bar:rgba(30,26,60,.9);--line:rgba(255,255,255,.12);--ink:#f1efff;--ink2:#c3bfe0;--acc:#9b8cff;--ok:#4fd39b;--warn:#f0b452;--bad:#ff7688}}
:root[data-theme="dark"]{--bg:#0f0d22;--bar:rgba(30,26,60,.9);--line:rgba(255,255,255,.12);--ink:#f1efff;--ink2:#c3bfe0;--acc:#9b8cff;--ok:#4fd39b;--warn:#f0b452;--bad:#ff7688}
*{box-sizing:border-box}
.hid{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,sans-serif}
.bar{position:fixed;top:0;inset-inline:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:5;font-size:14px}
.bar b{font-size:15px}
.bar select{height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;color:inherit;padding:0 8px;font:inherit}
.bar a{color:var(--acc);text-decoration:none;font-weight:600;margin-inline-start:auto;white-space:nowrap}
.st{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn);font-weight:600}.st.bad{color:var(--bad);font-weight:600}

.list a:hover{border-color:var(--acc)}

.lookb+a{margin-inline-start:0}
@media (max-width:600px){.bar .st{max-width:40vw}.bar b{display:none}}
</style>

<!-- «פחות עומס» (איילת 05.11.2026, אחרי בדיקת עיצוב): מוזרק לסוף כל מסעדה. רק מראה — לא נוגע בחישובים ובנתונים, ולא בהדפסה/PDF.
     1) בשורת הכפתורים בחוץ רק ביטול / החזרה / PDF / שמירה; הדפסה, אקסל, גיבוי ועותק לשליחה — בתוך «⬇ ייצוא ועוד ▾».
        בלי כפילויות מול השורה העליונה של הענן (הכותרת, «נשמר בענן») — מוצגים רק כשיש בעיה.
     2) אדום רק כשצריך לבדוק: מינוס חשבונאי רגיל בשורות רגילות (טיפ באשראי וכו') — בצבע הטקסט; שורות סיכום נשארות אדומות במינוס;
        בניתוח החודש הצבע רק בנקודה, והחריגות קודם. פירוט האשראי לא שונה: «זוהה: שונטל» אומר מאיפה הסכום, לא שההפרש מוסבר.
     3) עיצוב חדש (איילת בחרה 05.11.2026, אחרי 3 כיוונים שנדחו): בהיר עם סגול כמו בשכר, כתב גדול יותר, ובדשבורד כרטיס «השורה התחתונה» —
        הרווח הנקי גדול, «מכל 100 ₪ נשארו לך…», ופס אחד: עלות מכר / שכר / קבועות / שאר / רווח. המספרים נלקחים מכרטיסי הדשבורד שהמערכת חישבה (.dk),
        ולכן זהים למסך; אם כרטיס חסר — הכרטיס החדש לא מוצג והדשבורד נשאר כמו שהיה. -->
<script type="text/plain" id="lookCss">

.tag,.bd-tag,.am-chip,.aud-pen,.aud-fix,.cl-n,.cc-h,.bd-done,.bd-ch,.aud-srcb,.aud-scb,.am-vat,.rd-ic,.hdf-d,.om,nav .badge,.set .h,.aud-ok,.aud-df{font-size:12.5px!important}

/* בסיס בהיר-פרימיום (סגול כמו בשכר) + כרטיס «השורה התחתונה» */

.btn{border-radius:10px!important}.btn.primary{background:#6d28d9!important;border-color:#6d28d9!important}
table.g th{background:#f3f0fb!important;color:#3b3463}
table.g tr.sec td{background:#faf8ff!important;color:#5b21b6!important}
table.g tr.big td{background:#efeafc!important;color:#1b1830!important;border-top:2px solid #6d28d9!important;border-bottom:2px solid #6d28d9!important}
table.g td.yr,table.g tr.tot td.yr{background:#f6f3fd!important}table.g tr.big td.yr{background:#e6defb!important}
a,.lnk{color:#6d28d9!important}
.lk-hide{display:none!important}
#plHero{position:relative;overflow:hidden;margin:0 0 16px;padding:26px 28px 22px;border-radius:22px;color:#f4f1ff;
  background:radial-gradient(900px 400px at 100% 0%,#5b3bb8 0%,transparent 60%),radial-gradient(700px 380px at 0% 100%,#2d1f63 0%,transparent 65%),#1c1538;
  box-shadow:0 18px 40px rgba(28,21,56,.28)}
#plHero .hh{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap;align-items:flex-start}
#plHero .hk{font-size:14px;letter-spacing:.04em;color:#c9bdfc;font-weight:600}

#plHero.loss .hv{color:#ff9aa5}

#plHero .hc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#plHero .hc span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13.5px;color:#e9e4ff}
#plHero .dg{color:#6ee7b7!important}#plHero .dr{color:#ff9aa5!important}#plHero .dz{color:#c9bdfc}

#plHero .hi{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:#c9bdfc;margin-top:4px}
#plHero .hi b{color:#fff;font-size:16px;font-variant-numeric:tabular-nums}#plHero .hi em{font-style:normal;font-size:13px}
#plHero .hbar{display:flex;height:22px;border-radius:999px;overflow:hidden;margin:22px 0 14px;background:rgba(255,255,255,.08);gap:2px}
#plHero .hbar i{display:block;height:100%;transform-origin:right;animation:hbIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes hbIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#plHero .hbar i{animation:none}}
.hb-cg{background:#a78bfa}.hb-sl{background:#60a5fa}.hb-sg{background:#f0abfc}.hb-ot{background:#9ca3af}.hb-net{background:#34d399}
#plHero.loss .hb-net{background:#fb7185}

@media (max-width:700px){#plHero{padding:20px 18px;border-radius:18px}#plHero .hv{font-size:46px}#plHero .hh-side{min-width:0}}
#plHero .hc span span{background:none!important;border:0!important;padding:0!important}

#lkMenu[hidden]{display:none}
#lkMenu .btn{display:block;width:100%;text-align:start;border-color:transparent;background:transparent;box-shadow:none}
#lkMenu .btn:hover,#lkMenu .btn:focus-visible{background:var(--accent-soft,#e3eef8)}

<script type="text/plain" id="lookJs">
(function(){
  if(window.__plLook) return; window.__plLook=1;
  var d=document;
  /* 1. «⬇ ייצוא ועוד ▾» */
  function menu(){
    var tools=d.getElementById('navTools'); if(!tools||d.getElementById('lkWrap')) return;
    var items=['bPrint','bXls','bBak','bExportRO'].map(function(i){ return d.getElementById(i); }).filter(Boolean);
    if(!items.length) return;
    var wrap=d.createElement('span'); wrap.id='lkWrap';
    var b=d.createElement('button'); b.type='button'; b.className='btn'; b.id='lkMore'; b.textContent='⬇ ייצוא ועוד ▾';
    b.setAttribute('aria-haspopup','menu'); b.setAttribute('aria-expanded','false');
    var m=d.createElement('div'); m.id='lkMenu'; m.hidden=true;
    items.forEach(function(x){ m.appendChild(x); });
    wrap.appendChild(b); wrap.appendChild(m);
    var save=d.getElementById('bSave');
    if(save&&save.parentNode===tools) tools.insertBefore(wrap,save.nextSibling); else tools.appendChild(wrap);
    function set(o){ m.hidden=!o; b.setAttribute('aria-expanded',o?'true':'false'); }
    b.addEventListener('click',function(e){ e.stopPropagation(); set(m.hidden); });
    m.addEventListener('click',function(){ setTimeout(function(){ set(false); },0); });   /* החלון של הכפתור (אקסל, גיבוי…) נשאר פתוח */
    d.addEventListener('click',function(e){ if(!wrap.contains(e.target)) set(false); });
    d.addEventListener('keydown',function(e){ if(e.key==='Escape') set(false); });
  }
  /* «נשמר…» מוצג בשורה העליונה של הענן — כאן רק כשיש בעיה */
  var dirtyT=null;
  function status(){
    var s=d.getElementById('stat'), a=d.getElementById('autoS');
    if(s){
      if(s.classList.contains('dirty')){ if(!dirtyT&&!s.classList.contains('lk-show')) dirtyT=setTimeout(function(){ dirtyT=null; if(s.classList.contains('dirty')) s.classList.add('lk-show'); },4000); }
      else { clearTimeout(dirtyT); dirtyT=null; if(s.classList.contains('lk-show')) s.classList.remove('lk-show'); }
    }
    if(a){ var bad=!!a.querySelector('#bAuto,[style*="--warn"]')||/לא תומך/.test(a.textContent); if(bad!==a.classList.contains('lk-show')) a.classList.toggle('lk-show',bad); }
  }
  function run(){ menu(); status(); }
  run();
  var t=null; new MutationObserver(function(){ if(t) return; t=setTimeout(function(){ t=null; run(); },60); }).observe(d.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
})();
/* «השורה התחתונה» — כרטיס פתיחה בדשבורד. לוקח את המספרים מהכרטיסים שהמערכת כבר חישבה (.dk), כך שהם זהים למסך. אם משהו לא נמצא — לא מציג כלום */
(function(){
  if(window.__plHero) return; window.__plHero=1;
  var d=document;
  function num(t){ var m=String(t||'').replace(/[,\s₪]/g,'').match(/-?\d+(\.\d+)?/); return m?+m[0]:null; }
  function cards(){ var o={}; d.querySelectorAll('.dks .dk').forEach(function(c){ var t=(c.querySelector('.dk-t')||{}).textContent||''; o[t.trim()]=c; }); return o; }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function money(x){ return (x<0?'-':'')+'₪'+Math.round(Math.abs(x)).toLocaleString('en-US'); }
  function build(){
    var dks=d.querySelector('#main .dks'); if(!dks||d.getElementById('plHero')) return;
    var C=cards(), inc=C['הכנסות'], net=C['רווח נקי'], cg=C['עלות מכר'], sl=C['שכר'], sg=C['קבועות + הנהלה'], pre=C['רווח לפני ניכויים'];
    if(!inc||!net||!cg||!sl||!sg) return;
    var I=num(inc.querySelector('.dk-v').textContent), N=num(net.querySelector('.dk-v').textContent);
    var amt=function(c){ return num((c.querySelector('.dk-s')||{}).textContent); }, pct=function(c){ return num(c.querySelector('.dk-v').textContent); };
    var G=amt(cg), S=amt(sl), F=amt(sg); if([I,N,G,S,F].some(function(x){return x===null;})||I<=0) return;
    var O=I-G-S-F-N;   /* כל השאר (מימון, הכנסות/הוצאות אחרות) — כדי שהסכום יסתדר בדיוק */
    var month=((d.getElementById('curM')||{}).selectedOptions||[{}])[0].textContent||'';
    var cmp=function(c,i){ var x=c.querySelectorAll('.dk-c')[i]; return x?x.innerHTML:''; };
    var parts=[['cg','עלות מכר',G,pct(cg),cmp(cg,1)],['sl','שכר',S,pct(sl),cmp(sl,1)],['sg','קבועות + הנהלה',F,pct(sg),cmp(sg,1)]];
    if(Math.abs(O)>=1) parts.push(['ot',O>0?'שאר ההוצאות':'שאר ההכנסות',Math.abs(O),Math.abs(O)/I*100,'']);
    var pos=parts.filter(function(p){return p[0]!=='ot'||O>0;}), tot=pos.reduce(function(s,p){return s+p[2];},0)+Math.max(N,0);
    var w=function(v){ return (v/tot*100).toFixed(2)+'%'; };
    var bar=pos.map(function(p){ return '<i class="hb-'+p[0]+'" style="width:'+w(p[2])+'" title="'+esc(p[1])+' '+money(p[2])+'"></i>'; }).join('')+(N>0?'<i class="hb-net" style="width:'+w(N)+'" title="רווח נקי '+money(N)+'"></i>':'');
    var per100=(N/I*100);
    var leg=parts.map(function(p){ return '<div class="hl"><span class="hd hb-'+p[0]+'"></span><div><div class="hl-n">'+esc(p[1])+'</div><div class="hl-v">'+money(p[2])+' <small>· '+p[3].toFixed(1)+'%</small></div>'+(p[4]?'<div class="hl-c">'+p[4]+'</div>':'')+'</div></div>'; }).join('')+
      '<div class="hl hl-net"><span class="hd hb-net"></span><div><div class="hl-n">'+(N>=0?'נשאר לך':'הפסד')+'</div><div class="hl-v">'+money(N)+' <small>· '+per100.toFixed(1)+'%</small></div></div></div>';
    var h=d.createElement('section'); h.id='plHero'; h.className=N<0?'loss':'';
    h.innerHTML='<div class="hh"><div class="hh-main"><div class="hk">השורה התחתונה · '+esc(month)+'</div>'+
      '<div class="hv">'+money(N)+'</div><div class="hs">'+(N>=0?'רווח נקי':'הפסד')+' · '+per100.toFixed(1)+'% מההכנסות</div>'+
      '<div class="hc"><span>'+cmp(net,0)+'</span><span>'+cmp(net,1)+'</span></div></div>'+
      '<div class="hh-side"><div class="hq">מכל <b>100 ₪</b> שנכנסו ב'+esc(month)+'<br>'+(N>=0?'נשארו לך <b class="hq-n">'+per100.toFixed(1)+' ₪</b>':'יצאו <b class="hq-n">'+(100-per100).toFixed(1)+' ₪</b>')+'</div>'+
      '<div class="hi"><span>הכנסות</span><b>'+money(I)+'</b><em>'+cmp(inc,0)+'</em></div>'+(pre?'<div class="hi"><span>רווח לפני ניכויים</span><b>'+esc(pre.querySelector('.dk-v').textContent)+'</b></div>':'')+'</div></div>'+
      '<div class="hbar" role="img" aria-label="ההכנסות מתחלקות ל: '+parts.map(function(p){return p[1]+' '+p[3].toFixed(1)+'%';}).join(', ')+', רווח '+per100.toFixed(1)+'%">'+bar+'</div>'+
      '<div class="hleg">'+leg+'</div>';
    dks.parentNode.insertBefore(h,dks); dks.classList.add('lk-hide');
  }
