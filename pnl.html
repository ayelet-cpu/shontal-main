<style>
/* רווח והפסד בענן — 29.10.2026. העמוד הזה רק טוען: הקוד של כל מסעדה (pl_code) + הנתונים (pl_docs) מהענן,
   ומריץ אותם כמו שהם בתוך מסגרת. «שמירה אוטומטית» של המערכת שומרת לענן (pl_save) במקום לקובץ. */
:root{--bg:#f4f3fb;--bar:rgba(255,255,255,.86);--line:rgba(80,70,150,.16);--ink:#1d1a33;--ink2:#5b5776;--acc:#6a57de;--ok:#1f9d6a;--warn:#c27a12;--bad:#d6455a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0d22;--bar:rgba(30,26,60,.9);--line:rgba(255,255,255,.12);--ink:#f1efff;--ink2:#c3bfe0;--acc:#9b8cff;--ok:#4fd39b;--warn:#f0b452;--bad:#ff7688}}
:root[data-theme="dark"]{--bg:#0f0d22;--bar:rgba(30,26,60,.9);--line:rgba(255,255,255,.12);--ink:#f1efff;--ink2:#c3bfe0;--acc:#9b8cff;--ok:#4fd39b;--warn:#f0b452;--bad:#ff7688}
*{box-sizing:border-box}
.hid{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,sans-serif}
.bar{position:fixed;top:0;inset-inline:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:5;font-size:14px}
.bar b{font-size:15px}
.bar select{height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;color:inherit;padding:0 8px;font:inherit}
.bar a{color:var(--acc);text-decoration:none;font-weight:600;margin-inline-start:auto;white-space:nowrap}
.st{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn);font-weight:600}.st.bad{color:var(--bad);font-weight:600}

.list a:hover{border-color:var(--acc)}

.lookb+a{margin-inline-start:0}
@media (max-width:600px){.bar .st{max-width:40vw}.bar b{display:none}}
</style>

<!-- «פחות עומס» (איילת 05.11.2026, אחרי בדיקת עיצוב): מוזרק לסוף כל מסעדה. רק מראה — לא נוגע בחישובים ובנתונים, ולא בהדפסה/PDF.
     1) בשורת הכפתורים בחוץ רק ביטול / החזרה / PDF / שמירה; הדפסה, אקסל, גיבוי ועותק לשליחה — בתוך «⬇ ייצוא ועוד ▾».
        בלי כפילויות מול השורה העליונה של הענן (הכותרת, «נשמר בענן») — מוצגים רק כשיש בעיה.
     2) אדום רק כשצריך לבדוק: מינוס חשבונאי רגיל בשורות רגילות (טיפ באשראי וכו') — בצבע הטקסט; שורות סיכום נשארות אדומות במינוס;
        בניתוח החודש הצבע רק בנקודה, והחריגות קודם. פירוט האשראי לא שונה: «זוהה: שונטל» אומר מאיפה הסכום, לא שההפרש מוסבר.
     3) עיצוב חדש (איילת בחרה 05.11.2026, אחרי 3 כיוונים שנדחו): בהיר עם סגול כמו בשכר, כתב גדול יותר, ובדשבורד כרטיס «השורה התחתונה» —
        הרווח הנקי גדול, «מכל 100 ₪ נשארו לך…», ופס אחד: עלות מכר / שכר / קבועות / שאר / רווח. המספרים נלקחים מכרטיסי הדשבורד שהמערכת חישבה (.dk),
        ולכן זהים למסך; אם כרטיס חסר — הכרטיס החדש לא מוצג והדשבורד נשאר כמו שהיה. -->
<script type="text/plain" id="lookCss">

.tag,.bd-tag,.am-chip,.aud-pen,.aud-fix,.cl-n,.cc-h,.bd-done,.bd-ch,.aud-srcb,.aud-scb,.am-vat,.rd-ic,.hdf-d,.om,nav .badge,.set .h,.aud-ok,.aud-df{font-size:12.5px!important}

/* בסיס בהיר-פרימיום (סגול כמו בשכר) + כרטיס «השורה התחתונה» */

.btn{border-radius:10px!important}.btn.primary{background:#6d28d9!important;border-color:#6d28d9!important}
table.g th{background:#f3f0fb!important;color:#3b3463}
table.g tr.sec td{background:#faf8ff!important;color:#5b21b6!important}
table.g tr.big td{background:#efeafc!important;color:#1b1830!important;border-top:2px solid #6d28d9!important;border-bottom:2px solid #6d28d9!important}
table.g td.yr,table.g tr.tot td.yr{background:#f6f3fd!important}table.g tr.big td.yr{background:#e6defb!important}
a,.lnk{color:#6d28d9!important}
.lk-hide{display:none!important}
#plHero{position:relative;overflow:hidden;margin:0 0 16px;padding:26px 28px 22px;border-radius:22px;color:#f4f1ff;
  background:radial-gradient(900px 400px at 100% 0%,#5b3bb8 0%,transparent 60%),radial-gradient(700px 380px at 0% 100%,#2d1f63 0%,transparent 65%),#1c1538;
  box-shadow:0 18px 40px rgba(28,21,56,.28)}
#plHero .hh{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap;align-items:flex-start}
#plHero .hk{font-size:14px;letter-spacing:.04em;color:#c9bdfc;font-weight:600}

#plHero.loss .hv{color:#ff9aa5}

#plHero .hc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#plHero .hc span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13.5px;color:#e9e4ff}
#plHero .dg{color:#6ee7b7!important}#plHero .dr{color:#ff9aa5!important}#plHero .dz{color:#c9bdfc}

#plHero .hi{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:#c9bdfc;margin-top:4px}
#plHero .hi b{color:#fff;font-size:16px;font-variant-numeric:tabular-nums}#plHero .hi em{font-style:normal;font-size:13px}
#plHero .hbar{display:flex;height:22px;border-radius:999px;overflow:hidden;margin:22px 0 14px;background:rgba(255,255,255,.08);gap:2px}
#plHero .hbar i{display:block;height:100%;transform-origin:right;animation:hbIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes hbIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#plHero .hbar i{animation:none}}
.hb-cg{background:#a78bfa}.hb-sl{background:#60a5fa}.hb-sg{background:#f0abfc}.hb-ot{background:#9ca3af}.hb-net{background:#34d399}
#plHero.loss .hb-net{background:#fb7185}

@media (max-width:700px){#plHero{padding:20px 18px;border-radius:18px}#plHero .hv{font-size:46px}#plHero .hh-side{min-width:0}}
#plHero .hc span span{background:none!important;border:0!important;padding:0!important}

#lkMenu[hidden]{display:none}
#lkMenu .btn{display:block;width:100%;text-align:start;border-color:transparent;background:transparent;box-shadow:none}
#lkMenu .btn:hover,#lkMenu .btn:focus-visible{background:var(--accent-soft,#e3eef8)}

<script type="text/plain" id="lookJs">
(function(){
  if(window.__plLook) return; window.__plLook=1;
  var d=document;
  /* 1. «⬇ ייצוא ועוד ▾» */
  function menu(){
    var tools=d.getElementById('navTools'); if(!tools||d.getElementById('lkWrap')) return;
    var items=['bPrint','bXls','bBak','bExportRO'].map(function(i){ return d.getElementById(i); }).filter(Boolean);
    if(!items.length) return;
    var wrap=d.createElement('span'); wrap.id='lkWrap';
    var b=d.createElement('button'); b.type='button'; b.className='btn'; b.id='lkMore'; b.textContent='⬇ ייצוא ועוד ▾';
    b.setAttribute('aria-haspopup','menu'); b.setAttribute('aria-expanded','false');
    var m=d.createElement('div'); m.id='lkMenu'; m.hidden=true;
    items.forEach(function(x){ m.appendChild(x); });
    wrap.appendChild(b); wrap.appendChild(m);
    var save=d.getElementById('bSave');
    if(save&&save.parentNode===tools) tools.insertBefore(wrap,save.nextSibling); else tools.appendChild(wrap);
    function set(o){ m.hidden=!o; b.setAttribute('aria-expanded',o?'true':'false'); }
    b.addEventListener('click',function(e){ e.stopPropagation(); set(m.hidden); });
    m.addEventListener('click',function(){ setTimeout(function(){ set(false); },0); });   /* החלון של הכפתור (אקסל, גיבוי…) נשאר פתוח */
    d.addEventListener('click',function(e){ if(!wrap.contains(e.target)) set(false); });
    d.addEventListener('keydown',function(e){ if(e.key==='Escape') set(false); });
  }
  /* «נשמר…» מוצג בשורה העליונה של הענן — כאן רק כשיש בעיה */
  var dirtyT=null;
  function status(){
    var s=d.getElementById('stat'), a=d.getElementById('autoS');
    if(s){
      if(s.classList.contains('dirty')){ if(!dirtyT&&!s.classList.contains('lk-show')) dirtyT=setTimeout(function(){ dirtyT=null; if(s.classList.contains('dirty')) s.classList.add('lk-show'); },4000); }
      else { clearTimeout(dirtyT); dirtyT=null; if(s.classList.contains('lk-show')) s.classList.remove('lk-show'); }
    }
    if(a){ var bad=!!a.querySelector('#bAuto,[style*="--warn"]')||/לא תומך/.test(a.textContent); if(bad!==a.classList.contains('lk-show')) a.classList.toggle('lk-show',bad); }
  }
  function run(){ menu(); status(); }
  run();
  var t=null; new MutationObserver(function(){ if(t) return; t=setTimeout(function(){ t=null; run(); },60); }).observe(d.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
})();
/* «השורה התחתונה» — כרטיס פתיחה בדשבורד. לוקח את המספרים מהכרטיסים שהמערכת כבר חישבה (.dk), כך שהם זהים למסך. אם משהו לא נמצא — לא מציג כלום */
(function(){
  if(window.__plHero) return; window.__plHero=1;
  var d=document;
  function num(t){ var m=String(t||'').replace(/[,\s₪]/g,'').match(/-?\d+(\.\d+)?/); return m?+m[0]:null; }
  function cards(){ var o={}; d.querySelectorAll('.dks .dk').forEach(function(c){ var t=(c.querySelector('.dk-t')||{}).textContent||''; o[t.trim()]=c; }); return o; }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function money(x){ return (x<0?'-':'')+'₪'+Math.round(Math.abs(x)).toLocaleString('en-US'); }
  function build(){
    var dks=d.querySelector('#main .dks'); if(!dks||d.getElementById('plHero')) return;
    var C=cards(), inc=C['הכנסות'], net=C['רווח נקי'], cg=C['עלות מכר'], sl=C['שכר'], sg=C['קבועות + הנהלה'], pre=C['רווח לפני ניכויים'];
    if(!inc||!net||!cg||!sl||!sg) return;
    var I=num(inc.querySelector('.dk-v').textContent), N=num(net.querySelector('.dk-v').textContent);
    var amt=function(c){ return num((c.querySelector('.dk-s')||{}).textContent); }, pct=function(c){ return num(c.querySelector('.dk-v').textContent); };
    var G=amt(cg), S=amt(sl), F=amt(sg); if([I,N,G,S,F].some(function(x){return x===null;})||I<=0) return;
    var O=I-G-S-F-N;   /* כל השאר (מימון, הכנסות/הוצאות אחרות) — כדי שהסכום יסתדר בדיוק */
    var month=((d.getElementById('curM')||{}).selectedOptions||[{}])[0].textContent||'';
    var cmp=function(c,i){ var x=c.querySelectorAll('.dk-c')[i]; return x?x.innerHTML:''; };
    var parts=[['cg','עלות מכר',G,pct(cg),cmp(cg,1)],['sl','שכר',S,pct(sl),cmp(sl,1)],['sg','קבועות + הנהלה',F,pct(sg),cmp(sg,1)]];
    if(Math.abs(O)>=1) parts.push(['ot',O>0?'שאר ההוצאות':'שאר ההכנסות',Math.abs(O),Math.abs(O)/I*100,'']);
    var pos=parts.filter(function(p){return p[0]!=='ot'||O>0;}), tot=pos.reduce(function(s,p){return s+p[2];},0)+Math.max(N,0);
    var w=function(v){ return (v/tot*100).toFixed(2)+'%'; };
    var bar=pos.map(function(p){ return '<i class="hb-'+p[0]+'" style="width:'+w(p[2])+'" title="'+esc(p[1])+' '+money(p[2])+'"></i>'; }).join('')+(N>0?'<i class="hb-net" style="width:'+w(N)+'" title="רווח נקי '+money(N)+'"></i>':'');
    var per100=(N/I*100);
    var leg=parts.map(function(p){ return '<div class="hl"><span class="hd hb-'+p[0]+'"></span><div><div class="hl-n">'+esc(p[1])+'</div><div class="hl-v">'+money(p[2])+' <small>· '+p[3].toFixed(1)+'%</small></div>'+(p[4]?'<div class="hl-c">'+p[4]+'</div>':'')+'</div></div>'; }).join('')+
      '<div class="hl hl-net"><span class="hd hb-net"></span><div><div class="hl-n">'+(N>=0?'נשאר לך':'הפסד')+'</div><div class="hl-v">'+money(N)+' <small>· '+per100.toFixed(1)+'%</small></div></div></div>';
    var h=d.createElement('section'); h.id='plHero'; h.className=N<0?'loss':'';
    h.innerHTML='<div class="hh"><div class="hh-main"><div class="hk">השורה התחתונה · '+esc(month)+'</div>'+
      '<div class="hv">'+money(N)+'</div><div class="hs">'+(N>=0?'רווח נקי':'הפסד')+' · '+per100.toFixed(1)+'% מההכנסות</div>'+
      '<div class="hc"><span>'+cmp(net,0)+'</span><span>'+cmp(net,1)+'</span></div></div>'+
      '<div class="hh-side"><div class="hq">מכל <b>100 ₪</b> שנכנסו ב'+esc(month)+'<br>'+(N>=0?'נשארו לך <b class="hq-n">'+per100.toFixed(1)+' ₪</b>':'יצאו <b class="hq-n">'+(100-per100).toFixed(1)+' ₪</b>')+'</div>'+
      '<div class="hi"><span>הכנסות</span><b>'+money(I)+'</b><em>'+cmp(inc,0)+'</em></div>'+(pre?'<div class="hi"><span>רווח לפני ניכויים</span><b>'+esc(pre.querySelector('.dk-v').textContent)+'</b></div>':'')+'</div></div>'+
      '<div class="hbar" role="img" aria-label="ההכנסות מתחלקות ל: '+parts.map(function(p){return p[1]+' '+p[3].toFixed(1)+'%';}).join(', ')+', רווח '+per100.toFixed(1)+'%">'+bar+'</div>'+
      '<div class="hleg">'+leg+'</div>';

<script type="text/plain" id="au2Js">
/* ================= בדיקה שורה-שורה — מסך עבודה (איילת 22.11.2026, לפי ההדמיה שאושרה) =================
   שכבת תצוגה בלבד, מעל כל השכבות הקיימות: אותו חישוב, אותם סטטוסים, אותן פעולות (data-act קיימים) — בלי שינוי בנתונים.
   הקבוצות = בדיוק הלוח הקודם: 🔴 צריך בדיקה (כולל ספקים לא משויכים) · 🟠 אין במה להשוות · 🟢 תקין בוודאות + סומנו תקין.
   הפער 61 ↔ 64 בתצוגה הקודמת: «נבדקו X מתוך 61» ספר רק שורות בדוח, והעמודות כללו גם ספקים לא משויכים (שונטל/קונפורטי/אשראי בלי שורה).
   כאן הסה"כ = כל מה שבבדיקה, עם הפירוט «שורות בדוח + ספקים לא משויכים», כך שהקבוצות תמיד מסתכמות לסה"כ. */
(function () {
  if (window.__au2) return; window.__au2 = 1;
  try { if (typeof vAudit !== 'function' || typeof sureInfo !== 'function' || typeof bdShort !== 'function' || typeof ukSuggest !== 'function') return; } catch (e) { return; }
  const _base = vAudit;
  const isExp = it => /^(p:|rep:(salary|fixed|gaManual|finance|deductions):)/.test(it.path);
  const AFP = { exp: isExp, sdiff: it => it.s && it.s.st === 'diff', cdiff: it => it.c && it.c.st === 'diff', note: it => it.a && it.a.note,
    nme: it => it.a && it.a.note && NOTE_FOR(it.a) === 'me', ncl: it => it.a && it.a.note && NOTE_FOR(it.a) === 'claude', kk: it => it.k,
    anydiff: it => [it.s, it.c, it.k].some(c => c && c.st === 'diff'), kdiff: it => it.k && it.k.st === 'diff', nosrc: it => isExp(it) && !(it.a && it.a.src) };
  const has = c => c && !/na|none/.test(c.st);
  const ils = v => '₪' + nf2.format(v || 0);
  const SAL = p => { try { return typeof salOf === 'function' ? salOf(p, curM) : null; } catch (e) { return null; } };
  const ukAmt0 = o => o.c != null ? o.c : o.s != null ? o.s : o.kk != null ? o.kk : o.k;

  /* כל מה שבבדיקה — מריצים את השרשרת הקיימת בלי חיפוש/סינון, ולוקחים ממנה את השורות */
  function universe() {
    const sv = { aq: ui.aq, aF: ui.aF, aView: ui.aView };
    ui.aq = ''; ui.aF = ''; ui.aView = 'board';
    try { _base(); } finally { ui.aq = sv.aq; ui.aF = sv.aF; ui.aView = sv.aView; }
    const todo = AUD_ORDER.map(p => AUD_ROWS[p]).filter(Boolean);
    const done = Object.keys(AUD_ROWS).filter(p => !AUD_ORDER.includes(p)).map(p => AUD_ROWS[p]);
    const cat = {};
    todo.forEach(it => {
      if (it.uk) { cat[it.path] = 'r'; return; }
      const si = sureInfo(it);
      cat[it.path] = si && si.sure ? 'g' : si && si.bad.some(x => !/הסכום 0/.test(x)) ? 'r' : 'o';
    });
    done.forEach(it => { cat[it.path] = 'd'; });
    return { todo, done, cat, all: todo.concat(done) };
  }
  /* סיבות — מאותם תנאים ש«תקין בוודאות» בודק */
  function reasons(it, c) {
    const out = [];
    if (it.uk) { out.push(['uk', 'לא משויך לשורה']); return out; }
    if (it.miss) out.push(['miss', 'חסר החודש']);
    if (it.changed) out.push(['chg', 'השתנה מאז הסימון']);
    if (it.s && it.s.st === 'diff') out.push(['s', 'הפרש משונטל']);
    if (it.c && it.c.st === 'diff') out.push(['c', 'הפרש מקונפורטי']);
    if (it.k && it.k.st === 'diff') out.push(['k', 'הפרש מאשראי']);
    const L = has(it.s) ? lockOf(it, curM) : null;
    if (L && L.amt != null && Math.abs(L.amt - it.s.raw) > 1) out.push(['lk', 'קיבוע גיול שונה']);
    const si = sureInfo(it) || {};
    if (si.sc != null && Math.abs(si.sc) > 1) out.push(['sc', 'שונטל ≠ קונפורטי']);
    const w = SAL(it.path); if (w && Math.abs(w.amt - it.val) > 1) out.push([w.kind === 't' ? 't' : 'w', 'הפרש מ' + w.lbl]);
    if (it.a && it.a.note && NOTE_FOR(it.a) === 'claude' && !it.a.reply) out.push(['q', 'שאלה פתוחה לקלוד']);
    if (Math.abs(it.val) < 0.005 && !it.miss) out.push(['zero', 'סכום 0']);
    if (!out.length && c === 'o') out.push(['none', 'אין מקור להשוואה']);
    return out;
  }
  const RSN = [['uk', 'לא משויך לשורה'], ['s', 'הפרש משונטל'], ['c', 'הפרש מקונפורטי'], ['k', 'הפרש מאשראי'], ['w', 'הפרש מבקרת שכר'], ['t', 'הפרש ממיסים מרו״ח'], ['lk', 'קיבוע גיול שונה'], ['sc', 'שונטל ≠ קונפורטי'], ['miss', 'חסר החודש'], ['chg', 'השתנה מאז הסימון'], ['zero', 'סכום 0'], ['q', 'שאלה פתוחה לקלוד'], ['none', 'אין מקור להשוואה']];
  /* חומרה = כמה כסף בבעיה (ההפרש הגדול ביותר מכל מקור) */
  function sev(it) {
    if (it.uk) return Math.abs(ukAmt0(it) || 0);
    const d = c => has(c) && c.st === 'diff' ? Math.abs(c.diff || 0) : 0;
    let v = Math.max(d(it.s), d(it.c), d(it.k));
    const L = has(it.s) ? lockOf(it, curM) : null; if (L && L.amt != null) v = Math.max(v, Math.abs(L.amt - it.s.raw));
    const w = SAL(it.path); if (w) v = Math.max(v, Math.abs(w.amt - it.val));
    if (it.miss) v = Math.max(v, Math.abs(it.prevV || 0));
    if (it.changed && it.a) v = Math.max(v, Math.abs((it.a.val || 0) - it.val));
    return v;
  }
  const amtOf = it => it.uk ? ukAmt0(it) : it.val;
  function topic(it) { return bdShort(it); }
  function catTxt(it) { if (it.uk) return ['s', 'c', 'k'].filter(k => it.uk[k] != null).map(k => UK[k]).join(' + '); if (it.sec === 'ספקים') { const p = String(it.grp).split(' › '); return p.length > 1 ? p[0] : 'קניות'; } return it.sec || ''; }
  function matchQ(it, q) {
    if (!q) return true;
    if ((it.name + ' ' + (it.grp || '') + ' ' + topic(it)).includes(q)) return true;
    const n = q.replace(/[,₪\s]/g, ''); if (!/^-?\d+(\.\d+)?$/.test(n)) return false;
    const vs = [amtOf(it)]; if (!it.uk) [it.s, it.c, it.k].forEach(c => { if (has(c)) vs.push(c.raw); });
    return vs.some(v => v != null && (Math.abs(Math.abs(v) - Math.abs(+n)) < 1 || Math.abs(v).toFixed(2).replace('.00', '').includes(n)));
  }
  let LAST = null;
  function build() {
    const U = universe(), q = (ui.aq || '').trim(), af = ui.aF || '';
    const ukOn = !af || ['exp', 'kk', 'nosrc', 'anydiff'].includes(af);
    const pass = it => (it.uk ? ukOn : (!af || !AFP[af] || AFP[af](it))) && matchQ(it, q)
      && (!ui.au2T || topic(it) === ui.au2T) && (!ui.au2R || reasons(it, U.cat[it.path]).some(r => r[0] === ui.au2R));
    const n = { r: 0, o: 0, g: 0, d: 0 }; U.all.forEach(it => { n[U.cat[it.path]]++; });
    const st = ui.au2St || 'r';
    const inMain = c => st === 'all' ? (c === 'r' || c === 'o') : st === 'g' ? (c === 'g' || c === 'd') : c === st;
    const so = ui.au2S || 'sev';
    const S = { sev: (a, b) => (U.cat[a.path] === U.cat[b.path] ? 0 : U.cat[a.path] === 'r' ? -1 : U.cat[b.path] === 'r' ? 1 : 0) || sev(b) - sev(a) || Math.abs(amtOf(b) || 0) - Math.abs(amtOf(a) || 0),
      amt: (a, b) => Math.abs(amtOf(b) || 0) - Math.abs(amtOf(a) || 0), name: (a, b) => a.name.localeCompare(b.name, 'he'), ord: (a, b) => (a.uk ? -1 : a.ord || 0) - (b.uk ? -1 : b.ord || 0) };
    const main = U.all.filter(it => inMain(U.cat[it.path]) && pass(it)).sort(S[so] || S.sev);
    const okL = st === 'g' ? [] : U.all.filter(it => (U.cat[it.path] === 'g' || U.cat[it.path] === 'd') && pass(it)).sort((a, b) => (U.cat[a.path] === 'g' ? -1 : 1) - (U.cat[b.path] === 'g' ? -1 : 1) || a.name.localeCompare(b.name, 'he'));
    /* «עבור לבא» בחלון הגדול ו«לאשר את כל הירוקות» — לפי הסדר שעל המסך, וכל השורות שלא סומנו נשארות ברשימה */
    const vis = main.filter(it => U.cat[it.path] !== 'd').map(it => it.path);
    AUD_ORDER = vis.concat(U.todo.map(it => it.path).filter(p => !vis.includes(p)));
    const tot = U.all.length, nUk = U.all.filter(it => it.uk).length;
    LAST = { U, main, okL, n, tot, nUk, st };
    return LAST;
  }

  /* ---------- תצוגה ---------- */
  /* ---------- חודשים בעמודות ---------- */
  const ST0 = () => Math.max((D.settings && D.settings.startMonth) || 0, 0);
  function monthsShown() {
    const v = ui.au2V || 'ytd', st0 = ST0();
    const from = v === '6' ? Math.max(st0, curM - 5) : v === '3' ? Math.max(st0, curM - 2) : v === 'cur' ? curM : st0;
    const L = []; for (let mm = curM; mm >= from; mm--) L.push(mm); return L;   /* החודש הנוכחי ראשון (איילת 22.11: «תהפוך את סדר החודשים») */
  }
  let MC = {}, SPL = {};
  function mctx(mm) { if (MC[mm]) return MC[mm]; const byP = {}; ukAI(mm).forEach(x => { byP[x.path] = x; }); return (MC[mm] = { byP, kag: CC ? ccAgg(mm) : null }); }
  /* תא אחד (שורה × חודש): הסכום, ומה המקורות אומרים באותו חודש — אותה השוואה כמו בטבלת החודשים בחלון הגדול */
  function cellInfo(it, mm) {
    if (it.uk) { const o = it.uk; let v = 0; ['c', 's', 'k'].forEach(k => { if (!v && o.src[k].length) v = ukAmtK(o, mm, k); }); return { v, st: Math.abs(v) >= 0.5 ? 'uk' : 'none' }; }
    const C = mctx(mm), x = C.byP[it.path]; if (!x) return { v: 0, st: 'none' };
    const cur = mm === curM;
    const sC = cur ? it.s : (EXT.shontal ? extCmp('shontal', x, C.byP, mm) : null);
    const cC = cur ? it.c : (EXT.comforty ? extCmp('comforty', x, C.byP, mm) : null);
    const kC = cur ? it.k : (CC ? ccCmp(x, C.kag) : null);
    let w = null; try { w = typeof salOf === 'function' ? salOf(it.path, mm) : null; } catch (e) { }
    const ds = [], ok = [], tip = [];
    [[sC, 'שונטל'], [cC, 'קונפורטי'], [kC, 'אשראי']].forEach(([c, l]) => { if (!has(c)) return; if (c.st === 'diff') { ds.push(Math.abs(c.diff || 0)); tip.push(`${l} ${nf2.format(c.raw)} — הפרש ${nf2.format(c.diff)}`); } else { ok.push(l); tip.push(`${l} ${nf2.format(c.raw)} ✓`); } });
    if (w) { if (Math.abs(w.amt - x.val) > 1) { ds.push(Math.abs(w.amt - x.val)); tip.push(`${w.lbl} ${nf2.format(w.amt)} — הפרש ${nf2.format(x.val - w.amt)}`); } else { ok.push(w.lbl); tip.push(`${w.lbl} ✓`); } }
    const a = audGet(mm, it.path), marked = !!(a && a.ok && Math.abs((a.val || 0) - x.val) <= 0.5);
    const miss = cur && it.miss;
    return { v: x.val, st: miss ? 'miss' : ds.length ? 'diff' : ok.length ? 'ok' : 'none', d: ds.length ? Math.max(...ds) : 0, marked, tip: tip.join('\n'), s: sC, c: cC, k: kC, w, x };
  }
  function cumOf(it) { let t = 0; for (let mm = ST0(); mm <= curM; mm++) t += cellInfo(it, mm).v || 0; return t; }
  function au2Line(path) {
    const m = /^p:(.+)$/.exec(path || '');
    if (m) { for (const sx of D.purchases || []) for (const gr of sx.groups || []) for (const LL of Object.values(gr.sides || {})) for (const l of LL) if (l.id === m[1]) return l; return null; }
    const r = /^rep:([^:]+):(.+)$/.exec(path || ''); if (!r) return null;
    const sec = (D.report || {})[r[1]]; return Array.isArray(sec) ? sec.find(l => l.id === r[2]) || null : null;
  }
  /* מחזיר {mm: {k, n, tot, months}} לכל חודש שהוא תשלום מתוך חלוקה (רק נתונים — לא משנה כלום) */
  function splitOf(path) {
    const l = au2Line(path); if (!l || !Array.isArray(l.cells)) return {};
    const G = {};
    l.cells.forEach((c, mm) => { const x = /^=\s*([\d.]+)\s*\/\s*(\d+)\s*$/.exec(typeof c === 'string' ? c : ''); if (!x) return; const n = +x[2]; if (n < 2 || n > 36) return; const key = x[1] + '/' + n; (G[key] = G[key] || { tot: +x[1], n, months: [] }).months.push(mm); });
    const out = {};
    Object.values(G).forEach(g => g.months.forEach((mm, i) => { out[mm] = { k: i + 1, n: g.n, tot: g.tot, months: g.months }; }));
    return out;
  }
  const CHIP = { r: ['דורש טיפול', 'r'], o: ['ממתין להתאמה', 'o'], g: ['תקין — לאישור', 'g'], d: ['סומן תקין', 'd'] };
  function rowHtml(it, c, selP, MS) {
    const rs = reasons(it, c), a = it.a || {}, sv = c === 'r' || c === 'o' ? sev(it) : 0, P = esc(it.path);
    const ico = (a.reply && !a.handled ? '<span title="יש תשובה מקלוד">💬</span>' : '') + (a.src ? `<span class="au2-src">${esc(a.src)}</span>` : '');
    const chk = it.uk || c === 'd' ? '<td class="au2-ck"></td>' : `<td class="au2-ck"><input type="checkbox" data-au2sel="${P}"${(ui.au2Sel || {})[it.path] ? ' checked' : ''} aria-label="בחירה"></td>`;
    const cells = MS.map(mm => {
      const ci = cellInfo(it, mm), v = ci.v, big = ci.st === 'diff' && ci.d >= Math.max(500, Math.abs(v) * 0.1);
      const spl = it.uk ? null : (SPL[it.path] || (SPL[it.path] = splitOf(it.path)))[mm];
      const mk = (spl ? `<i class="au2-spl" title="חשבונית ₪${nf2.format(spl.tot)} חולקה ל-${spl.n} תשלומים — זה תשלום ${spl.k}">💳${spl.k}/${spl.n}</i>` : '') + (ci.marked ? '<i class="au2-mk" title="סומן תקין">✓</i>' : ci.st === 'ok' ? '<i class="au2-okm" title="תואם למקור">✓</i>' : ci.st === 'diff' ? '<i class="au2-dfm">≠</i>' : '');
      const tip = `${M[mm]}: ₪${nf2.format(v)}${ci.tip ? '\n' + ci.tip : ''}${ci.st === 'miss' ? '\nהיה סכום בחודשים הקודמים — החודש אין' : ''}${ci.st === 'uk' ? '\nלא משויך לשורה ברווח והפסד' : ''}\nלחיצה — פרטי ההתאמה`;
      const f0 = x => Math.round(x).toLocaleString('he-IL');
      const sl = (lbl, c, val) => `<span class="${c === 'df' ? 'df' : c === 'ok' ? 'ok' : ''}">${lbl} ${f0(val)}</span>`;
      const SR = [];
      if (it.uk) { const o = it.uk; ['s', 'c', 'k'].forEach(k => { if (o.src[k].length) { const vv = ukAmtK(o, mm, k); if (Math.abs(vv) >= 0.5) SR.push(sl({ s: 'ש', c: 'ק', k: 'א' }[k], '', vv)); } }); }
      else {
        [[ci.s, 'ש'], [ci.c, 'ק'], [ci.k, 'א']].forEach(([c, l]) => { if (has(c)) SR.push(sl(l + (c.n > 1 ? 'Σ' : ''), c.st === 'diff' ? 'df' : 'ok', c.raw)); });
        if (ci.w) SR.push(sl(ci.w.kind === 't' ? 'מ' : 'ב', Math.abs(ci.w.amt - v) > 1 ? 'df' : 'ok', ci.w.amt));
      }
      const srcLine = SR.length ? `<div class="au2-sl2">${SR.join('')}</div>` : '';
      return `<td class="au2-c st-${ci.st}${big ? ' big' : ''}${mm === curM ? ' cur' : ''}${selP === it.path && (ui.au2M ?? curM) === mm ? ' csel' : ''}" data-au2c="${P}" data-m="${mm}" title="${esc(tip)}"><div class="au2-pl">${Math.abs(v) < 0.005 ? '<span class="au2-z">—</span>' : nf2.format(v)}${mk}</div>${srcLine}</td>`;
    }).join('');
    const si = it.uk ? null : sureInfo(it);
    const cmpTd = (() => {
      const ci = cellInfo(it, curM), L = [], money = x => '₪' + nf2.format(x);
      const ln = (lbl, val, cls, extra) => `<div class="au2-clx ${cls || ''}"><span>${lbl}:</span><b>${val}</b>${extra || ''}</div>`;
      if (it.uk) {
        const o = it.uk, NM = { s: 'שונטל', c: 'קונפורטי', k: 'אשראי' };
        L.push(ln('ברווח והפסד', 'לא משויך לשורה', 'pl df'));
        ['s', 'k', 'c'].forEach(k => { if (o.src[k].length) L.push(ln(NM[k], money(ukAmtK(o, curM, k)), '')); });
      } else {
        L.push(ln('ברווח והפסד', Math.abs(ci.v) < 0.005 ? '—' : money(ci.v), 'pl'));
        let n = 0;
        [[ci.s, 'שונטל'], [ci.k, 'אשראי'], [ci.c, 'קונפורטי']].forEach(([c, l]) => { if (!has(c)) return; n++; const df = c.st === 'diff'; L.push(ln(l, money(c.raw), df ? 'df' : 'ok', df ? '' : ' <i>✓</i>')); });
        if (ci.w) { n++; const df = Math.abs(ci.w.amt - ci.v) > 1; L.push(ln(ci.w.lbl || (ci.w.kind === 't' ? 'מיסים' : 'בקרת שכר'), money(ci.w.amt), df ? 'df' : 'ok', df ? '' : ' <i>✓</i>')); }
        if (!n) L.push('<div class="au2-clx none">אין מקור להשוואה</div>');
        const gap = ci.d || 0;
        if (n) L.push(ln('פער', gap >= 0.5 ? money(gap) : '0 ✓', gap >= 0.5 ? 'gap df' : 'gap ok'));
      }
      return `<td class="au2-cmpx" data-au2open="${P}" title="לחיצה — פרטי ההתאמה של ${esc(M[curM])}">${L.join('')}</td>`;
    })();
    const okTd = `<td class="au2-okx">${it.uk ? (c === 'd' ? `<div class="au2-bigdone">✓ טופל</div><button class="au2-un" data-act="ukUn" data-p="${P}" title="החזרה לבדיקה">↩ ביטול</button>` : `<button class="au2-bigok no" data-au2no="${P}" title="לא נכנס לרווח והפסד — רק החודש או תמיד">✕ לא שייך<small>שכר / לא לרווח והפסד</small></button><button class="au2-ukx" data-act="ukMap" data-k="${esc(it.uk.key)}" title="כבר רשום בשורה קיימת — נזכר לכל החודשים">🔗 שיוך לשורה</button><button class="au2-ukx" data-act="ukNew" data-k="${esc(it.uk.key)}" title="נפתחת שורת ספק חדשה בקניות עם הסכום של החודש">➕ ספק חדש</button>`) : c === 'd' ? `<div class="au2-bigdone">✓ אושר</div><button class="au2-un" data-act="audUn" data-p="${P}" title="החזרה לבדיקה">↩ ביטול</button>` : `<button class="au2-bigok${c === 'g' ? ' g' : ''}" data-act="audOkRow" data-p="${P}" title="${c === 'g' ? 'כל המקורות תואמים — לסמן תקין' : 'לאשר שהסכום ברווח והפסד נכון (' + ils(it.val) + ')'}">✓ אישור</button>`}</td>`;
    const chips = it.uk ? `<span class="bd-ch df">${esc(catTxt(it))}</span>` : bdChips(it, si);

    ' if(window.__PLC&&window.__PLC.view){ var fix=function(){ var b=document.querySelector(".ro-banner"); if(b&&!b.dataset.v){ b.dataset.v=1; b.textContent="👁 צפייה בלבד — הנתונים מתעדכנים מהענן. לחיצה על סכום מציגה את הפירוט והחשבוניות שלו (📄). אפשר לייצא, אבל לא לשנות."; } };'+
    ' fix(); document.addEventListener("DOMContentLoaded",fix); setTimeout(fix,500); } })();<\/script>';
  if(VIEW) docJs+='<script id="plViewJs">'+$('viewJs').textContent.replace(/<\/script/gi,'<\\/script')+'<\/script>';
  docJs+='<script id="plXhJs">'+$('xhJs').textContent.replace(/<\/script/gi,'<\\/script')+'<\/script>';   /* ✛ הדגשת שורה ועמודה (10.11.2026) */
  docJs+='<script id="plHbJs">'+$('hbJs').textContent.replace(/<\/script/gi,'<\\/script')+'<\/script>';   /* 📄 חלון הפירוט לא נעלם (22.11.2026) */
  var be=html.lastIndexOf('</body>'); html=be<0?html+docJs:html.slice(0,be)+docJs+html.slice(be);
  /* «פחות עומס» (05.11.2026) — בסוף הדף, אחרי שהמערכת בנתה את שורת הכפתורים. «🎨» בשורה העליונה מחזיר למראה הקודם */
  if(useLook()){ var b=html.lastIndexOf('</body>'), look='<style id="plLook">'+$('lookCss').textContent+'</style><script id="plLookJs">'+$('lookJs').textContent.replace(/<\/script/gi,'<\\/script')+'<\/script>';
    html=b<0?html+look:html.slice(0,b)+look+html.slice(b); }
  return html;
}
/* «קובץ» מדומה: מה שהמערכת קוראת וכותבת — הולך לענן */
function makeHandle(){
  var AS_OPEN=OPEN('data');
  return {
    kind:'file', get name(){ return FILE_NAME; },
    queryPermission:function(){ return Promise.resolve('granted'); },
    requestPermission:function(){ return Promise.resolve('granted'); },
    getFile:function(){ return rpc('pl_data',{p_rest:REST}).then(function(r){
      BASE=r.stamp; var t=AS_OPEN+js(r.data)+CLOSE; return {size:t.length,text:function(){ return Promise.resolve(t); }}; }); },
    createWritable:function(){ var buf='';
      return Promise.resolve({ write:function(x){ buf+=x; return Promise.resolve(); },
        close:function(){
          if(VIEW) return Promise.reject(new Error('צפייה בלבד'));
          var i=buf.indexOf(AS_OPEN), j=buf.indexOf(CLOSE,i);
          if(i<0||j<0) return Promise.reject(new Error('שמירה לא תקינה'));
          var data=JSON.parse(buf.slice(i+AS_OPEN.length,j));
          setSt('שומרת בענן…','');
          return rpc('pl_save',{p_rest:REST,p_base:BASE,p_data:data,p_force:false}).then(function(r){
            if(!r||!r.ok){ var e=new Error('changed'); e.changed=true; setSt('⚠ מישהו עדכן בענן בינתיים — השמירה נעצרה. רענני (F5).','warn'); throw e; }
            BASE=r.stamp; if(PEEK&&PEEK.data) PEEK.data.stamp=r.stamp; setSt('☁ נשמר בענן · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),'ok');
          },function(e){ setSt('⚠ לא נשמר בענן: '+e.message,'bad'); throw e; });
        } }); }
  };
}
/* 📄 פתיחת חשבונית מהענן של שונטל: השרת בודק שהמסמך שייך למסעדה הזו ונותן קישור ל-5 דקות (pl-doc-url → pl_doc) */
function openDoc(href,w){
  var rel='', PFX='Users/PC/האחסון שלי/חשבוניות ווטסאפ/';
  try{ rel=String(href).replace(/^file:\/\/\/[A-Za-z]:\//,'').split('/').map(decodeURIComponent).join('/'); }catch(_){}
  var bad=function(t){ try{ if(w) w.close(); }catch(_){} setSt(t,'warn'); };
  /* 10.11.2026: חשבונית שירדה מהענן לתיקייה «מסמכים מהענן» במחשב — הנתיב שאחריה הוא הנתיב בענן של שונטל */
  var CACHE='/מסמכים מהענן/', ci=rel.indexOf(CACHE);
  if(ci>=0) rel=PFX+rel.slice(ci+CACHE.length);
  if(rel.indexOf(PFX)!==0) return bad('⚠ המסמך הזה נמצא רק במחשב של איילת — אין לו עותק בענן');
  rel=rel.slice(PFX.length);
  fresh().then(function(){ return fetch(SB+'/functions/v1/pl-doc-url',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+S.access_token,'Content-Type':'application/json'},body:JSON.stringify({rest:REST,path:rel})}); })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j&&j.url){ if(w&&!w.closed) w.location.href=j.url; else window.open(j.url,'_blank'); return; }
      bad(j&&j.found===false?'⚠ החשבונית הזו עוד לא הועלתה לענן של שונטל':'⚠ החשבונית לא נפתחה: '+((j&&j.error)||''));
    },function(e){ bad('⚠ החשבונית לא נפתחה: '+e.message); });
}
function setSt(t,c,btn){ var s=$('st'); s.className='st '+(c||''); s.textContent=t; if(btn){ var b=document.createElement('button'); b.textContent=btn; b.onclick=function(){ location.reload(); }; s.appendChild(b); } }

function list(){
  return rpc('pl_list').then(function(a){
    $('bar').classList.add('hid');
    if(!a||!a.length){ $('view').innerHTML='<div class="msg"><h1>אין גישה</h1><p>למשתמש הזה אין הרשאה לרווח והפסד.</p></div>'; return; }
    $('view').innerHTML='<div class="msg list"><h1>רווח והפסד</h1>'+a.map(function(x){ return '<a href="?r='+esc(x.rest)+'">'+esc(NAMES[x.rest]||x.title)+'<small>'+esc(x.title)+'</small></a>'; }).join('')+'</div>';
  });
}
function open(rest){
  REST=rest;
  return Promise.all([rpc('pl_get',{p_rest:rest}),rpc('pl_list')]).then(function(res){
    var g=res[0], a=res[1]||[];
    if(!g||!g.code) throw new Error('אין במערכת מסעדה כזו: '+rest);
    var docs=g.docs||{}; BASE=(docs.data||{}).stamp; FILE_NAME=(((docs.data||{}).data||{}).meta||{}).fileName||'';
    PEEK={}; Object.keys(docs).forEach(function(k){ PEEK[k]={stamp:docs[k].stamp}; });
    VIEW=g.can_edit===false;   /* צפייה בלבד (pl_users.can_edit) — השרת כבר שלח את הנתונים במצב «לצפייה בלבד» וחוסם שמירה */
    var html=patch(build(rest==='asa'?asaWords(g.code):g.code,docs));
    window.__PLC_BRIDGE={handle:makeHandle(),rest:rest,openDoc:openDoc,view:VIEW};
    if(VIEW) $('back').classList.add('hid');
    document.title=(g.title||'רווח והפסד')+' · ענן';
    $('rsel').innerHTML=a.map(function(x){ return '<option value="'+esc(x.rest)+'"'+(x.rest===rest?' selected':'')+'>'+esc(NAMES[x.rest]||x.rest)+'</option>'; }).join('');
    $('rsel').onchange=function(){ location.search='?r='+encodeURIComponent(this.value); };
    $('bar').classList.remove('hid');
    var u=(docs.data||{}).updated_by, at=(docs.data||{}).updated_at;
    setSt((VIEW?'👁 צפייה בלבד':'☁ בענן')+(at?' · עודכן '+new Date(at).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+(u?' ('+u+')':''):''),'ok');
    var fr=document.createElement('iframe'); fr.id='fr'; fr.title=g.title||'רווח והפסד';
    $('view').innerHTML=''; $('view').appendChild(fr); fr.srcdoc=html;
    setInterval(watch,60000);
  });
}
/* שינוי מבחוץ (קלוד עדכן השוואה לשונטל / נתונים) — מודיעים, לא מרעננים לבד */
function watch(){
  if(document.hidden) return;
  rpc('pl_peek',{p_rest:REST}).then(function(p){
    if(!p||!PEEK) return; var ch=[];
    ['ext','cc','refs'].forEach(function(k){ if(p[k]&&(!PEEK[k]||p[k].stamp!==PEEK[k].stamp)) ch.push(k); });
    var dataCh=p.data&&p.data.stamp!==BASE;
    if(dataCh) setSt('⚠ הנתונים עודכנו בענן ('+(p.data.updated_by||'')+') — לרענן לפני שממשיכים','warn','רענון');
    else if(ch.length) setSt('נתוני ההשוואה (שונטל / אשראי) התעדכנו בענן','', 'רענון');
  },function(){});
}
function start(){
  var r=new URLSearchParams(location.search).get('r');
  (r?open(r):list()).catch(fail);
}
if(S&&S.refresh_token) start(); else loginView();
})();
</script>
